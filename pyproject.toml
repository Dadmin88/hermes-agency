[build-system]
requires = ["hatchling>=1.21,<1.22"]
build-backend = "hatchling.build"

[project]
name = "hermes-agency"
version = "0.7.3"
description = "Hermes Agency: P2P multi-agent orchestration plugin for Hermes Agent (83-agent roster, orchestration, Kanban, team context). Built on the AgentAnycast Python SDK."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    { name = "Hermes Agency Contributors" },
]
keywords = [
    "a2a", "a2a-protocol", "agent", "agent-communication", "p2p", "libp2p",
    "grpc", "mcp", "mcp-server", "crewai", "langgraph", "google-adk", "openai-agents",
    "claude-agent-sdk", "strands-agents", "pydantic-ai", "agno", "zero-config",
    "end-to-end-encryption", "nat-traversal", "decentralized", "noise-protocol", "did",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "keryx @ git+https://github.com/DeployFaith/hermes-keryx.git@main#subdirectory=sdk/python",
    "hermes-agent>=0.17.0",
    "grpcio>=1.60",
    "protobuf>=7.34.1",
    "httpx>=0.27",
    "click>=8.0",
    "base58>=2.1",
    "cryptography>=42.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/DeployFaith/Hermes_Agency"
Repository = "https://github.com/DeployFaith/Hermes_Agency"
Issues = "https://github.com/DeployFaith/Hermes_Agency/issues"
Changelog = "https://github.com/DeployFaith/Hermes_Agency/blob/main/CHANGELOG.md"

[project.optional-dependencies]
crewai = ["crewai>=0.80"]
langgraph = ["langgraph>=0.2"]
adk = ["google-adk>=1.0"]
openai-agents = ["openai-agents>=0.10"]
claude = ["claude-agent-sdk>=0.1"]
strands = ["strands-agents>=0.1"]
pydantic-ai = ["pydantic-ai>=0.1"]
agno = ["agno>=1.0"]
mcp = ["agentanycast-mcp>=0.7"]
adapters = [
    "crewai>=0.80", "langgraph>=0.2", "google-adk>=1.0", "openai-agents>=0.10",
    "claude-agent-sdk>=0.1", "strands-agents>=0.1", "pydantic-ai>=0.1", "agno>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
hermes-agency = "hermes_agency.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentanycast", "hermes-agency"]
sources = { "hermes-agency" = "hermes_agency" }
dev-mode-dirs = [".", "src"]
exclude = [
    "/hermes-agency/tests",
    "/hermes-agency/**/__pycache__",
    "/hermes-agency/**/*.pyc",
]


[tool.hatch.build.targets.sdist]
exclude = [
    "/hermes-agency/tests",
    "/hermes-agency/**/__pycache__",
    "/hermes-agency/**/*.pyc",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "src/agentanycast/_generated",
    "examples/",
    "hermes-agency/default_staff/profiles/*/skills/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"hermes-agency/**/*.py" = ["E501"]
"hermes-agency/**/__init__.py" = ["N999"]
"hermes-agency/kanban_bridge.py" = ["N818"]
"hermes-agency/tests/test_e2e*.py" = ["N818"]
"hermes-agency/tests/test_unit.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "agentanycast._generated.*"
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "base58"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agentanycast.mcp_server"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "grpc.aio", "grpc.aio.*", "google.protobuf.*", "crewai", "crewai.*", "langgraph", "langgraph.*", "google.adk", "google.adk.*", "google.genai", "google.genai.*", "agents", "agents.*", "claude_agent_sdk", "claude_agent_sdk.*", "strands", "strands.*", "mcp", "mcp.*", "pydantic_ai", "pydantic_ai.*", "agno", "agno.*", "dns", "dns.*", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "hermes-agency/tests/test_unit.py", "hermes-agency/tests/test_model_sets.py", "hermes-agency/tests/test_extended_status_discord.py"]
markers = [
    "integration: mark test as integration test (requires relay/daemon binaries)",
]
# Default: skip integration tests. Run explicitly with: pytest -m integration
addopts = "-m 'not integration'"
