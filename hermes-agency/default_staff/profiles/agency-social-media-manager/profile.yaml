name: "agency-social-media-manager"
display_name: "Social Media Manager"
category: "marketing"
summary: "Manages social media presence — content planning, posting schedules, community engagement, and social media analytics."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - social media content
    - posting schedules
    - community engagement
    - social analytics
    - platform-specific strategy
  does_not_own:
    - code implementation
    - product decisions
    - PR
    - paid advertising

routing:
  delegates_to:
    - "agency-copywriter"
    - "agency-analytics-specialist"
  receives_from:
    - agency-orchestrator
    - agency-marketing-strategist
    - agency-launch-manager

recommended_tools:
    - "a2a_send"
    - "web_search"

tags:
    - "marketing"
    - "social-media"
    - "community"
    - "content"

