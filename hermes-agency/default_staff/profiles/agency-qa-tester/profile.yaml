name: agency-qa-tester
display_name: QA Tester
category: qa
summary: Executes test cases, reports defects, verifies fixes, and performs exploratory
  testing to find issues before users do.
agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full
  relay_security:
    auto_allow_team: true
ownership:
  owns:
  - test execution
  - defect reporting
  - fix verification
  - exploratory testing
  - test case maintenance
  does_not_own:
  - feature implementation
  - product decisions
  - QA strategy
  - infrastructure
routing:
  delegates_to: []
  receives_from:
  - agency-orchestrator
  - agency-qa-lead
  - agency-release-manager
recommended_tools:
- a2a_send
- terminal
tags:
- qa
- testing
- bugs
- exploratory
