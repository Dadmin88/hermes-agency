name: "agency-backend-engineer"
display_name: "Backend Engineer"
category: "engineering"
summary: "Implements server-side logic, APIs, data processing pipelines, and backend services with focus on reliability and scalability."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - backend implementation
    - API development
    - server-side logic
    - data processing
    - backend performance
  does_not_own:
    - frontend UI
    - infrastructure operations
    - database schema design
    - product decisions

routing:
  delegates_to:
    - "agency-git-steward"
    - "agency-qa-tester"
  receives_from:
    - agency-orchestrator
    - agency-technical-lead
    - agency-software-architect

recommended_tools:
    - "a2a_send"
    - "terminal"

tags:
    - "engineering"
    - "backend"
    - "api"
    - "implementation"

