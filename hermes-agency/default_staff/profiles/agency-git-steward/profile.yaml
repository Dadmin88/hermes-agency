name: "agency-git-steward"
display_name: "Git Steward"
category: "qa"
summary: "Manages git operations — branching strategy, commit hygiene, merge/rebase operations, and repository health."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full

ownership:
  owns:
    - git operations
    - branching strategy
    - commit hygiene
    - merge/rebase management
    - repository health
    - changelog generation
  does_not_own:
    - feature implementation
    - product decisions
    - design
    - marketing

routing:
  delegates_to: []

  receives_from:
    - agency-orchestrator
    - agency-release-manager
    - agency-technical-lead

recommended_tools:
    - "a2a_send"
    - "terminal"

tags:
    - "qa"
    - "git"
    - "version-control"
    - "repository"

