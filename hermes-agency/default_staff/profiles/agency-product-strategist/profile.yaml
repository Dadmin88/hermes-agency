name: agency-product-strategist
display_name: Product Strategist
category: product
summary: Develops long-term product strategy, identifies market opportunities, and
  aligns product direction with business objectives and competitive landscape.
agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full
  relay_security:
    auto_allow_team: true
ownership:
  owns:
  - product strategy
  - market positioning
  - competitive differentiation
  - long-term vision
  - product-market fit analysis
  does_not_own:
  - feature implementation
  - sprint planning
  - design execution
  - marketing campaigns
routing:
  delegates_to:
  - agency-competitive-analyst
  - agency-market-researcher
  - agency-monetization-strategist
  receives_from:
  - agency-orchestrator
  - agency-product-manager
  - agency-chief-of-staff
recommended_tools:
- a2a_send
- a2a_discover
tags:
- product
- strategy
- vision
- market
