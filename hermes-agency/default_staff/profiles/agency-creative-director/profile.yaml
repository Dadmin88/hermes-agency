name: "agency-creative-director"
display_name: "Creative Director"
category: "design"
summary: "Sets creative vision and direction for all visual and experiential work. Ensures creative consistency across all outputs."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
- creative vision
- creative direction
- visual language
- creative standards
- cross-project creative consistency
  does_not_own:
- individual design execution
- code implementation
- business strategy
- marketing execution

routing:
  delegates_to:
    - "agency-art-director"
    - "agency-product-designer"
    - "agency-brand-designer"
  receives_from:
- agency-orchestrator
- agency-chief-of-staff
- user

recommended_tools:
    - "a2a_send"

tags:
    - "design"
    - "creative"
    - "leadership"
    - "vision"
