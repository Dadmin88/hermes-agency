name: "agency-integration-engineer"
display_name: "Integration Engineer"
category: "engineering"
summary: "Builds and maintains integrations with external services, APIs, and third-party systems, ensuring reliable cross-system communication."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - external integrations
    - API client implementations
    - webhook handling
    - third-party service connections
    - integration testing
  does_not_own:
    - internal architecture
    - product decisions
    - infrastructure operations
    - marketing

routing:
  delegates_to:
    - "agency-git-steward"
    - "agency-qa-tester"
  receives_from:
    - agency-orchestrator
    - agency-technical-lead
    - agency-product-manager

recommended_tools:
    - "a2a_send"
    - "terminal"

tags:
    - "engineering"
    - "integration"
    - "api"
    - "third-party"

