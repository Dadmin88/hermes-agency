name: "agency-scrum-master"
display_name: "Scrum Master"
category: "leadership"
summary: "Facilitates agile ceremonies, removes blockers, protects sprint commitments, and drives continuous improvement."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full

ownership:
  owns:
    - "sprint planning"
    - "blocker removal"
    - "retrospectives"
    - "velocity tracking"
    - "process improvement"
  does_not_own:
    - "task execution"
    - "strategic direction"
    - "technical decisions"
    - "creative direction"

routing:
  delegates_to:
    - "agency-orchestrator"
    - "agency-project-manager"
  receives_from:
    - "agency-orchestrator"
    - "agency-project-manager"
    - "agency-traffic-manager"

recommended_tools:
    - "a2a_send"
    - "a2a_discover"

tags:
    - "leadership"
    - "agile"
    - "process"
    - "sprint"

