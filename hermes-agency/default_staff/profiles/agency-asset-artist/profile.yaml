name: "agency-asset-artist"
display_name: "Asset Artist"
category: "design"
summary: "Creates 2D and 3D art assets — sprites, textures, models, animations — that populate the game world."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - 2D art assets
    - 3D models
    - textures
    - sprite sheets
    - asset quality
  does_not_own:
    - art direction
    - code implementation
    - game design
    - marketing

routing:
  delegates_to: []

  receives_from:
    - agency-orchestrator
    - agency-art-director
    - agency-level-designer

recommended_tools:
    - "a2a_send"

tags:
    - "design"
    - "art"
    - "assets"
    - "2d"
    - "3d"

