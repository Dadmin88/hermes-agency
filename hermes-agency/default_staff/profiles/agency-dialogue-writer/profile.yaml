name: "agency-dialogue-writer"
display_name: "Dialogue Writer"
category: "content"
summary: "Writes character dialogue, NPC conversations, branching dialogue trees, and voice lines that bring game characters to life."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full

ownership:
  owns:
    - character dialogue
    - NPC conversations
    - dialogue trees
    - voice lines
    - character voice consistency
  does_not_own:
    - lore writing
    - game mechanics
    - code implementation
    - art

routing:
  delegates_to: []

  receives_from:
    - agency-orchestrator
    - agency-worldbuilder
    - agency-game-designer

recommended_tools:
    - "a2a_send"

tags:
    - "content"
    - "dialogue"
    - "narrative"
    - "game"

