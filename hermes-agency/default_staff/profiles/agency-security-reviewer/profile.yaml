name: "agency-security-reviewer"
display_name: "Security Reviewer"
category: "qa"
summary: "Reviews code, configurations, and architecture for security vulnerabilities, compliance issues, and security best practices."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - security code review
    - vulnerability identification
    - security best practices enforcement
    - security assessment
  does_not_own:
    - feature implementation
    - product decisions
    - infrastructure operations
    - design

routing:
  delegates_to:
    - null
  receives_from:
    - agency-orchestrator
    - agency-qa-lead
    - agency-code-reviewer

recommended_tools:
    - "a2a_send"
    - "terminal"

tags:
    - "qa"
    - "security"
    - "review"
    - "vulnerabilities"

