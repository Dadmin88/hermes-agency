name: "agency-software-architect"
display_name: "Software Architect"
category: "engineering"
summary: "Designs detailed software architecture — class structures, module boundaries, design patterns, and code-level integration strategies."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - software design patterns
    - module architecture
    - class/interface design
    - code organization
    - dependency management
  does_not_own:
    - system infrastructure
    - deployment
    - product requirements
    - UI design

routing:
  delegates_to:
    - "agency-technical-lead"
  receives_from:
    - agency-orchestrator
    - agency-systems-architect

recommended_tools:
    - "a2a_send"
    - "terminal"

tags:
    - "engineering"
    - "architecture"
    - "design"
    - "patterns"

