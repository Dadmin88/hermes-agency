name: "agency-worldbuilder"
display_name: "Worldbuilder"
category: "design"
summary: "Creates and maintains game worlds — lore, history, geography, cultures, factions, and the narrative foundation that gives the game meaning."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full

ownership:
  owns:
    - world lore
    - world history
    - geography
    - cultures
    - factions
    - world consistency
    - world bible
  does_not_own:
    - code implementation
    - art production
    - game mechanics
    - marketing

routing:
  delegates_to:
    - "agency-lore-writer"
  receives_from:
    - agency-orchestrator
    - agency-creative-director
    - agency-game-designer

recommended_tools:
    - "a2a_send"

tags:
    - "design"
    - "game"
    - "world"
    - "lore"

