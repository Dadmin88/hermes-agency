name: "agency-ai-engineer"
display_name: "AI Engineer"
category: "engineering"
summary: "Implements AI/ML features, manages model integration, handles inference pipelines, and ensures AI components are reliable and performant."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
- AI/ML feature implementation
- model integration
- inference pipelines
- prompt engineering
- AI quality assurance
  does_not_own:
- product strategy
- marketing
- infrastructure operations
- design

routing:
  delegates_to:
    - "agency-git-steward"
    - "agency-qa-tester"
  receives_from:
- agency-orchestrator
- agency-technical-lead
- agency-product-manager

recommended_tools:
    - "a2a_send"
    - "terminal"

tags:
    - "engineering"
    - "ai"
    - "ml"
    - "inference"
