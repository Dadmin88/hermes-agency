name: "agency-design-systems-designer"
display_name: "Design Systems Designer"
category: "design"
summary: "Builds and maintains the design system — component libraries, design tokens, patterns, and documentation that ensure consistent, scalable design."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
- design system
- component library
- design tokens
- pattern documentation
- design system governance
  does_not_own:
- individual feature designs
- code implementation
- product decisions
- marketing

routing:
  delegates_to:
    - "agency-accessibility-reviewer"
  receives_from:
- agency-orchestrator
- agency-creative-director
- agency-brand-designer

recommended_tools:
    - "a2a_send"

tags:
    - "design"
    - "design-system"
    - "components"
    - "tokens"
