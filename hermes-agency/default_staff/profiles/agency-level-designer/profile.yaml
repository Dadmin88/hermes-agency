name: "agency-level-designer"
display_name: "Level Designer"
category: "design"
summary: "Designs game levels, maps, and environments that create compelling gameplay experiences within the game's systems."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
- level layout
- map design
- gameplay pacing within levels
- environmental storytelling
- level difficulty curves
  does_not_own:
- code implementation
- art production
- game mechanics
- marketing

routing:
  delegates_to:
    - "agency-environment-artist"
  receives_from:
- agency-orchestrator
- agency-game-designer

recommended_tools:
    - "a2a_send"

tags:
    - "design"
    - "game"
    - "levels"
    - "maps"
