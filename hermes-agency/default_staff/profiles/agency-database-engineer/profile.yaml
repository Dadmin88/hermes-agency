name: "agency-database-engineer"
display_name: "Database Engineer"
category: "engineering"
summary: "Designs database schemas, optimizes queries, manages migrations, and ensures data storage is reliable, performant, and well-structured."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - database schemas
    - query optimization
    - database migrations
    - data modeling
    - database performance
  does_not_own:
    - application logic
    - data pipelines
    - infrastructure operations
    - product decisions

routing:
  delegates_to:
    - "agency-git-steward"
  receives_from:
    - agency-orchestrator
    - agency-technical-lead
    - agency-backend-engineer

recommended_tools:
    - "a2a_send"
    - "terminal"

tags:
    - "engineering"
    - "database"
    - "sql"
    - "data-modeling"

