name: "agency-brand-designer"
display_name: "Brand Designer"
category: "design"
summary: "Creates and maintains brand identity — logos, color palettes, typography, brand guidelines, and ensures brand consistency across all touchpoints."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - brand identity
    - logo design
    - color palette
    - typography system
    - brand guidelines
    - brand consistency
  does_not_own:
    - code implementation
    - product decisions
    - marketing campaigns
    - infrastructure

routing:
  delegates_to:
    - "agency-design-systems-designer"
  receives_from:
    - agency-orchestrator
    - agency-creative-director

recommended_tools:
    - "a2a_send"

tags:
    - "design"
    - "brand"
    - "identity"
    - "visual-language"

