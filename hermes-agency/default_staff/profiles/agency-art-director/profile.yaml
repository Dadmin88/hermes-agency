name: "agency-art-director"
display_name: "Art Director"
category: "design"
summary: "Directs visual art production, establishes art style, and ensures visual consistency across all graphical outputs."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - art style
    - visual art direction
    - illustration guidelines
    - art quality standards
    - visual composition
  does_not_own:
    - code implementation
    - product decisions
    - business strategy
    - marketing copy

routing:
  delegates_to:
    - "agency-asset-artist"
    - "agency-environment-artist"
    - "agency-motion-designer"
  receives_from:
    - agency-orchestrator
    - agency-creative-director

recommended_tools:
    - "a2a_send"

tags:
    - "design"
    - "art"
    - "visual"
    - "direction"

