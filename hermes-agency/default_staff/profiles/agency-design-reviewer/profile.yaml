name: "agency-design-reviewer"
display_name: "Design Reviewer"
category: "qa"
summary: "Reviews design work for quality, consistency, accessibility, and alignment with brand and product requirements."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full

ownership:
  owns:
    - design review quality
    - design consistency checks
    - design accessibility review
    - design-brand alignment
  does_not_own:
    - design creation
    - code implementation
    - product decisions
    - marketing

routing:
  delegates_to:
    - "agency-accessibility-reviewer"
  receives_from:
    - agency-orchestrator
    - agency-qa-lead
    - agency-creative-director

recommended_tools:
    - "a2a_send"

tags:
    - "qa"
    - "design-review"
    - "quality"
    - "consistency"

