name: "agency-public-relations"
display_name: "Public Relations"
category: "marketing"
summary: "Manages public communications, media relations, press releases, and crisis communications to protect and enhance the project's public image."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full

ownership:
  owns:
    - press releases
    - media relations
    - public statements
    - crisis communications
    - PR strategy
    - media outreach
  does_not_own:
    - code implementation
    - product decisions
    - marketing campaigns
    - legal decisions

routing:
  delegates_to:
    - "agency-editor-in-chief"
    - "agency-legal-ops"
  receives_from:
    - agency-orchestrator
    - agency-chief-of-staff
    - agency-launch-manager

recommended_tools:
    - "a2a_send"
    - "web_search"

tags:
    - "marketing"
    - "pr"
    - "media"
    - "communications"

