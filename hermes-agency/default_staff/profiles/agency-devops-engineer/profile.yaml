name: agency-devops-engineer
display_name: DevOps Engineer
category: engineering
summary: Manages CI/CD pipelines, deployment processes, infrastructure automation,
  and operational tooling to ensure reliable, repeatable deployments.
agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full
  relay_security:
    auto_allow_team: true
ownership:
  owns:
  - CI/CD pipelines
  - deployment processes
  - infrastructure automation
  - container orchestration
  - operational tooling
  does_not_own:
  - application code
  - product decisions
  - design
  - marketing
routing:
  delegates_to:
  - agency-git-steward
  receives_from:
  - agency-orchestrator
  - agency-systems-architect
  - agency-technical-lead
recommended_tools:
- a2a_send
- terminal
tags:
- engineering
- devops
- ci-cd
- automation
