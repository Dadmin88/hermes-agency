name: "agency-traffic-manager"
display_name: "Traffic Manager"
category: "leadership"
summary: "Manages work-in-progress limits, prioritizes incoming requests, prevents overload, and ensures the team works on the right things."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true
  incoming:
    tool_access: full

ownership:
  owns:
    - "WIP limits"
    - "request prioritization"
    - "workload balancing"
    - "queue management"
    - "urgent triage"
  does_not_own:
    - "task execution"
    - "strategic direction"
    - "project planning"
    - "technical decisions"

routing:
  delegates_to:
    - "agency-orchestrator"
    - "agency-project-manager"
  receives_from:
    - "agency-orchestrator"
    - "agency-project-manager"
    - "user"

recommended_tools:
    - "a2a_send"
    - "a2a_list_peers"

tags:
    - "leadership"
    - "operations"
    - "prioritization"
    - "triage"

