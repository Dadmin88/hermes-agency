name: "agency-audio-designer"
display_name: "Audio Designer"
category: "design"
summary: "Designs and produces sound effects, ambient audio, music direction, and audio systems for games and interactive experiences."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
    - sound effects
    - ambient audio
    - audio direction
    - audio systems
    - audio mixing
    - audio asset management
  does_not_own:
    - code implementation
    - visual design
    - game mechanics
    - marketing

routing:
  delegates_to:
    - null
  receives_from:
    - agency-orchestrator
    - agency-creative-director
    - agency-game-designer

recommended_tools:
    - "a2a_send"

tags:
    - "design"
    - "audio"
    - "sound"
    - "music"

