name: "agency-performance-engineer"
display_name: "Performance Engineer"
category: "engineering"
summary: "Identifies and resolves performance bottlenecks, conducts load testing, optimizes resource usage, and ensures the system meets performance SLAs."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
- performance optimization
- load testing
- profiling
- performance monitoring
- SLA compliance
  does_not_own:
- feature implementation
- product decisions
- marketing
- design

routing:
  delegates_to:
    - "agency-git-steward"
  receives_from:
- agency-orchestrator
- agency-technical-lead
- agency-qa-lead

recommended_tools:
    - "a2a_send"
    - "terminal"

tags:
    - "engineering"
    - "performance"
    - "optimization"
    - "testing"
