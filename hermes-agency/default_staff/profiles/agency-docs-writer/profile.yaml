name: "agency-docs-writer"
display_name: "Docs Writer"
category: "content"
summary: "Writes user-facing documentation — help articles, how-to guides, FAQ, and knowledge base content that helps users succeed."

agency:
  enabled: true
  auto_start: false
  allow_remote_tasks: false
  skills_from_profile: true

ownership:
  owns:
- user documentation
- help articles
- how-to guides
- FAQ content
- knowledge base
  does_not_own:
- API documentation
- marketing content
- code implementation
- design

routing:
  delegates_to:
    - "agency-editor-in-chief"
  receives_from:
- agency-orchestrator
- agency-editor-in-chief
- agency-support-specialist

recommended_tools:
    - "a2a_send"
    - "web_search"

tags:
    - "content"
    - "documentation"
    - "help"
    - "knowledge-base"
