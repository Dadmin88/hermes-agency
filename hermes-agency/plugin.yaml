name: hermes-agency
version: 0.1.0
description: "Hermes Agency P2P multi-agent collaboration tools for Hermes profiles. Feature-complete collaboration stack: node lifecycle, peer discovery, team context, context packets, announcements, orchestration, Kanban tracking, self-serve fallback, autonomous self-registration, bidding, workflows, proactive task creation, autonomy policy checks, learning feedback, and tenant-aware routing."
author: DeployFaith
kind: standalone
provides_tools:
  - a2a_discover
  - a2a_send
  - a2a_status
  - a2a_inbox
  - a2a_start_node
  - a2a_stop_node
  - a2a_list_peers
  - a2a_info
  - a2a_registry
  - a2a_bid_task
  - a2a_execute_workflow
  - a2a_create_proactive_task
  - a2a_check_autonomy
  - a2a_log_routing_correction
  - orch_route
  - orch_decompose
  - orch_status
  - orch_list_tasks
  - orch_escalate
provides_hooks:
  - on_session_start
  - pre_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
