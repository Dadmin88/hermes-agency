version: 1
name: economic
description: "Cheap default routing for day-to-day Hermes Agency work."

defaults:
  family: general_worker

families:
  general_worker:
    provider: opencode-go
    model: deepseek-v4-flash
    reason: "Cheap routine worker."
  coding_worker:
    provider: opencode-go
    model: deepseek-v4-pro
    reason: "Stronger coding and reasoning worker."
  creative_worker:
    provider: xai
    model: grok-4.3
    reason: "Creative, product, copy, and visual reasoning."
  analysis_worker:
    provider: opencode-go
    model: deepseek-v4-pro
    reason: "Analysis and product planning."
  review_worker:
    provider: opencode-go
    model: deepseek-v4-pro
    reason: "QA and implementation review."
  orchestration:
    provider: opencode-go
    model: deepseek-v4-pro
    reason: "Coordinator with strong context handling."
  senior_review:
    provider: openai-codex
    model: gpt-5.5
    reason: "Escalation for high-risk review."

profiles:
  agency-orchestrator: orchestration
  agency-software-architect: senior_review
  agency-systems-architect: senior_review
  agency-security-reviewer: senior_review
  agency-compliance-reviewer: senior_review
  agency-backend-engineer: coding_worker
  agency-frontend-engineer: coding_worker
  agency-fullstack-engineer: coding_worker
  agency-godot-engineer: coding_worker
  agency-copywriter: creative_worker
  agency-worldbuilder: creative_worker

escalation:
  default_family: senior_review
  triggers: [security, legal, release, destructive_change, architecture]

budget:
  max_input_cost_per_1m: null
  max_output_cost_per_1m: null
  warn_if_unknown_pricing: true

metadata:
  source: packaged
  last_reviewed: "2026-06-26"
