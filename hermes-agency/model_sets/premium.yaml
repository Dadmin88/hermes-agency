version: 1
name: premium
description: "Quality-first routing with GPT-5.5 on coordination, architecture, review, and high-risk work."

defaults:
  family: general_worker

families:
  general_worker:
    provider: openai-codex
    model: gpt-5.5
    reason: "Premium default quality."
  coding_worker:
    provider: openai-codex
    model: gpt-5.5
    reason: "Premium coding and debugging."
  creative_worker:
    provider: xai
    model: grok-4.3
    reason: "Creative and visual/worldbuilding reasoning."
  analysis_worker:
    provider: openai-codex
    model: gpt-5.5
    reason: "Premium analysis and product planning."
  review_worker:
    provider: openai-codex
    model: gpt-5.5
    reason: "Premium QA and review."
  orchestration:
    provider: openai-codex
    model: gpt-5.5
    reason: "Premium orchestration."
  senior_review:
    provider: openai-codex
    model: gpt-5.5
    reason: "Escalation for high-risk review."

profiles:
  agency-orchestrator: orchestration
  agency-copywriter: creative_worker
  agency-worldbuilder: creative_worker
  agency-creative-director: creative_worker

escalation:
  default_family: senior_review
  triggers: [security, legal, release, destructive_change, architecture]

budget:
  max_input_cost_per_1m: null
  max_output_cost_per_1m: null
  warn_if_unknown_pricing: true

metadata:
  source: packaged
  last_reviewed: "2026-06-26"
