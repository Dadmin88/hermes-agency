version: 1
name: openai-codex
description: >
  Single-provider Agency model set. Routes every profile through OpenAI Codex
  with GPT-5.6 Sol / Terra / GPT-5.5 matched to task complexity.

defaults:
  family: general_worker

families:
  # ── Tier 1: GPT-5.6 Sol — heavy/complex engineering, no higher escalation ──
  coding_worker:
    provider: openai-codex
    model: gpt-5.6-sol
    reason: >
      Heavy-duty and complex coding work (backend, fullstack, infra, platform,
      DevOps, data engineering, automation, integration). Sol has code + reasoning
      and is the strongest available model — no escalation needed.

  # ── Tier 2: GPT-5.6 Terra — general work, orchestration, analysis ──
  general_worker:
    provider: openai-codex
    model: gpt-5.6-terra
    reason: >
      General non-coding work: community, support, marketing, operations,
      knowledge management. Terra is the balanced workhorse.

  orchestration:
    provider: openai-codex
    model: gpt-5.6-terra
    reason: >
      Orchestrator handles routing, synthesis, decomposition, and recovery.
      Terra provides the reasoning depth needed for coordination. Escalates
      to Sol for security-critical or architecture-level decisions.

  analysis_worker:
    provider: openai-codex
    model: gpt-5.6-terra
    reason: >
      Research, product strategy, business analysis, market research, finance,
      requirements analysis. Terra has the reasoning and code capability for
      data-heavy analysis.

  creative_worker:
    provider: openai-codex
    model: gpt-5.6-terra
    reason: >
      Creative and content work: copywriting, docs, worldbuilding, art direction,
      game design, lore, scripts. Terra handles long-form generation well.

  senior_review:
    provider: openai-codex
    model: gpt-5.6-sol
    reason: >
      Senior/sensitive reviews: architecture, security, compliance, legal, release
      gates, systems design. These are high-stakes decisions — use the strongest
      model. Escalation target for lower tiers.

  # ── Tier 3: GPT-5.5 — lightweight coding, normal reviews, routine ops ──
  coding_light:
    provider: openai-codex
    model: gpt-5.5
    reason: >
      Lightweight coding tasks: minor fixes, formatting, simple scripts, boilerplate.
      GPT-5.5 is cost-effective for straightforward work. Escalates to Terra for
      complex logic, Sol for architecture-sensitive code.

  review_worker:
    provider: openai-codex
    model: gpt-5.5
    reason: >
      Normal code reviews, QA checks, accessibility reviews, git steward tasks.
      GPT-5.5 handles standard review patterns. Escalates to Terra when uncertain,
      Sol for security/architecture concerns.

  lightweight_worker:
    provider: openai-codex
    model: gpt-5.5
    reason: >
      Routine support, operations, coordination, email, onboarding. GPT-5.5 is
      sufficient for standard operational tasks.

# ── Profile → Family mapping ──
