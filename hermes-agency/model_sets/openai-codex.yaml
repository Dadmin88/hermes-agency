# ── Escalation policy ──
escalation:
  default_family: senior_review
  triggers:
    - security
    - legal
    - release
    - destructive_change
    - architecture
    - ambiguous_requirements
    - uncertain
    - inconclusive
    - orchestration

task_routing:
  enabled: true
  mode: conservative

  default:
    provider: openai-codex
    model: gpt-5.5
    tier: baseline

  health:
    preflight: config
    cache_ttl_seconds: 300
    block_if_safe_default_unhealthy: true

  classifier:
    downgrade_min_confidence: 0.85
    uncertain_goes_to_default: true
    long_context_parent_threshold: 3
    long_context_body_chars: 12000
    repeated_failure_threshold: 1

  tiers:
    baseline:
      provider: openai-codex
      model: gpt-5.5
      reason: Default baseline — GPT-5.5 for routine tasks.

    terra:
      provider: openai-codex
      model: gpt-5.6-terra
      reason: >
        General work, orchestration, analysis, creative. Escalation target
        from baseline for complex non-code tasks.

    sol:
      provider: openai-codex
      model: gpt-5.6-sol
      reason: >
        Heavy engineering and senior review. Top tier — no further escalation.
        Also the escalation target from Terra for security/architecture decisions.

    luna:
      provider: openai-codex
      model: gpt-5.6-luna
      reason: >
        Reasoning-focused tier (no code capability). Use for text-only analysis,
        writing review, or reasoning-heavy non-code escalation from baseline.

  escalation:
    force_tier: sol
    tags:
      - security
      - privacy
      - compliance
      - legal
      - architecture
      - api_design
      - system_design
      - release
      - deployment
      - destructive_change
      - code_review
      - qa_signoff
      - ambiguous_requirements
      - long_context
      - repeated_failure
      - orchestration
      - uncertain
      - inconclusive
    assignees:
      - agency-orchestrator
      - agency-software-architect
      - agency-systems-architect
      - agency-security-reviewer
      - agency-code-reviewer
      - agency-release-manager
    keyword_rules:
      security_keyword:
        any: [security, secret, credential, auth, privacy]
        tags: [security]
      architecture_keyword:
        any: [architecture, design, boundary, api design, system design]
        tags: [architecture]
      release_keyword:
        any: [release, deploy, production, rollback, migration]
        tags: [release]
      review_uncertain_keyword:
        any: [uncertain, inconclusive, cannot determine, ambiguous]
        tags: [uncertain]
      orchestration_keyword:
        any: [orchestrate, decompose, fan out, route work]
        tags: [orchestration]

  downgrade_rules:
    docs_typo:
      tier: baseline
      confidence: 0.9
      all:
        file_globs: ["docs/**/*.md", "*.md"]
        keywords_any: [typo, spelling, grammar, formatting]
      deny_tags: [security, release, architecture, code_review]
    readonly_summary:
      tier: baseline
      confidence: 0.88
      all:
        tool_access: read_only
        keywords_any: [summarize, extract, list, inspect]
      max_body_chars: 6000
      deny_tags: [security, legal, release, code_review]

budget:
  max_input_cost_per_1m: null
  max_output_cost_per_1m: null
  warn_if_unknown_pricing: false

metadata:
  source: packaged
  provider_policy: openai-codex-only
  last_reviewed: "2026-07-10"
  rollout: gpt-5.6-sol-terra-gpt55
  notes:
    - Single provider: all families use openai-codex.
    - Sol for heavy engineering + senior review (no higher escalation).
    - Terra for general work, orchestration, analysis, creative (escalates to Sol).
    - GPT-5.5 for lightweight coding, normal reviews, routine ops (escalates to Terra/Sol).
    - Luna available as reasoning-only escalation tier for non-code tasks.
