version: 1
name: balanced
description: "Balanced default routing for Hermes Agency: economical workers, stronger review, GPT escalation."

defaults:
  family: general_worker

families:
  general_worker:
    provider: opencode-go
    model: deepseek-v4-pro
    reason: "Reliable default worker without making every agent premium."
  coding_worker:
    provider: opencode-go
    model: qwen3-coder-plus
    reason: "Coding-focused daily driver."
  creative_worker:
    provider: xai
    model: grok-4.3
    reason: "Creative and worldbuilding work."
  analysis_worker:
    provider: opencode-go
    model: deepseek-v4-pro
    reason: "General research, product, and planning."
  review_worker:
    provider: openai-codex
    model: gpt-5.5
    reason: "Review roles benefit from stronger reasoning."
  orchestration:
    provider: openai-codex
    model: gpt-5.5
    reason: "Orchestrator handles routing, synthesis, and recovery."
  senior_review:
    provider: openai-codex
    model: gpt-5.5
    reason: "Escalation for high-risk review."

profiles:
  agency-orchestrator: orchestration
  agency-software-architect: senior_review
  agency-systems-architect: senior_review
  agency-security-reviewer: senior_review
  agency-code-reviewer: review_worker
  agency-qa-lead: review_worker
  agency-backend-engineer: coding_worker
  agency-frontend-engineer: coding_worker
  agency-fullstack-engineer: coding_worker
  agency-godot-engineer: coding_worker
  agency-copywriter: creative_worker
  agency-worldbuilder: creative_worker

escalation:
  default_family: senior_review
  triggers: [security, legal, release, destructive_change, architecture]

budget:
  max_input_cost_per_1m: null
  max_output_cost_per_1m: null
  warn_if_unknown_pricing: true

metadata:
  source: packaged
  last_reviewed: "2026-06-26"
