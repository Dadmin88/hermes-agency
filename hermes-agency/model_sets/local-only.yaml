version: 1
name: local-only
description: "Validation guard for truly local/no-cost routing. This intentionally fails until a real local provider/model is configured."

defaults:
  family: general_worker

families:
  general_worker:
    provider: local
    model: disabled-placeholder
    enabled: false
    reason: "Placeholder only. Replace with a real local Hermes-supported provider/model before use."
  coding_worker:
    provider: local
    model: disabled-placeholder
    enabled: false
    reason: "Placeholder only."
  creative_worker:
    provider: local
    model: disabled-placeholder
    enabled: false
    reason: "Placeholder only."
  analysis_worker:
    provider: local
    model: disabled-placeholder
    enabled: false
    reason: "Placeholder only."
  review_worker:
    provider: local
    model: disabled-placeholder
    enabled: false
    reason: "Placeholder only."
  orchestration:
    provider: local
    model: disabled-placeholder
    enabled: false
    reason: "Placeholder only."
  senior_review:
    provider: local
    model: disabled-placeholder
    enabled: false
    reason: "Placeholder only."

profiles: {}

escalation:
  default_family: senior_review
  triggers: [security, legal, release, destructive_change, architecture]

budget:
  max_input_cost_per_1m: 0
  max_output_cost_per_1m: 0
  warn_if_unknown_pricing: false

metadata:
  source: packaged
  last_reviewed: "2026-06-26"
