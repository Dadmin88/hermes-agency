escalation:
  default_family: senior_review
  triggers: [security, legal, release, destructive_change, architecture, ambiguous_requirements]

task_routing:
  enabled: true
  mode: conservative
  default:
    provider: openai-codex
    model: gpt-5.5
    tier: gpt55_rollback
  health:
    preflight: config
    cache_ttl_seconds: 300
    block_if_safe_default_unhealthy: true
  classifier:
    downgrade_min_confidence: 0.85
    uncertain_goes_to_default: true
    long_context_parent_threshold: 3
    long_context_body_chars: 12000
    repeated_failure_threshold: 1
  tiers:
    gpt55_rollback:
      provider: openai-codex
      model: gpt-5.5
      reason: "DF-653 rollback tier for all Agency workers."
  escalation:
    force_tier: gpt55_rollback
    tags: [security, privacy, compliance, legal, architecture, api_design, system_design, release, deployment, destructive_change, code_review, qa_signoff, ambiguous_requirements, long_context, repeated_failure, orchestration]
    assignees: [agency-orchestrator, agency-software-architect, agency-systems-architect, agency-security-reviewer, agency-code-reviewer, agency-release-manager]
    keyword_rules:
      security_keyword:
        any: [security, secret, credential, auth, privacy]
        tags: [security]
      architecture_keyword:
        any: [architecture, design, boundary, api design, system design]
        tags: [architecture]
      release_keyword:
        any: [release, deploy, production, rollback, migration]
        tags: [release]
      review_keyword:
        any: [review, approval, signoff, merge readiness]
        tags: [code_review]
      destructive_keyword:
        any: [delete, destructive, rewrite, bulk, irreversible]
        tags: [destructive_change]
  downgrade_rules:
    docs_typo:
      tier: gpt55_rollback
      confidence: 0.90
      all:
        file_globs: ["docs/**/*.md", "*.md"]
        keywords_any: [typo, spelling, grammar, formatting]
      deny_tags: [security, release, architecture, code_review]
    readonly_summary:
      tier: gpt55_rollback
      confidence: 0.88
      all:
        tool_access: read_only
        keywords_any: [summarize, extract, list, inspect]
      max_body_chars: 6000
      deny_tags: [security, legal, release, code_review]

budget:
  max_input_cost_per_1m: null
  max_output_cost_per_1m: null
  warn_if_unknown_pricing: false

metadata:
  source: packaged
  provider_policy: openai-codex-only
  last_reviewed: "2026-07-10"
  rollout: gpt-5.5-rollback
  notes:
    - "All families intentionally use provider=openai-codex."
    - "All Hermes Agency worker families intentionally use model=gpt-5.5."
    - "No GPT-5.6 routing tiers are enabled in this rollback policy."
