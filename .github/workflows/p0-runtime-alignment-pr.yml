name: P0 Runtime Alignment PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  align-runtime:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-product-truth-keryx-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and diagnostic tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Apply asserted runtime alignment
        run: python scripts/p0_runtime_alignment.py

      - name: Align patched Hermes Agent references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "hermes-agency/README.md": [
                  ("`hermes-agent>=0.17.0`", "`hermes-agent>=0.18.0`"),
                  (
                      "When `transport_backend: keryx` is configured but the Keryx SDK is not importable, the plugin falls back to AgentAnycast compatibility when available.",
                      "When `transport_backend: keryx` is configured but the Keryx SDK is not importable, Agency reports the selected transport as unavailable rather than silently switching backends.",
                  ),
              ],
              "apps/fabric/docker/hermes-gateway-smoke/Dockerfile": [
                  ("ARG HERMES_VERSION=0.17.0", "ARG HERMES_VERSION=0.18.0"),
              ],
              "apps/fabric/scripts/smoke/hermes-gateway-e2e.sh": [
                  ('HERMES_VERSION="${HERMES_VERSION:-0.17.0}"', 'HERMES_VERSION="${HERMES_VERSION:-0.18.0}"'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                  elif new not in text:
                      raise SystemExit(f"{filename}: expected text not found: {old}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Normalize Python formatting
        run: |
          ruff check hermes-agency --fix
          ruff format hermes-agency

      - name: Capture dependency audit
        run: |
          pip-audit --strict . > docs/audits/p0-pip-audit.txt 2>&1 || true

      - name: Capture Agency test result
        run: |
          make test-agency > docs/audits/p0-test-output.txt 2>&1 || true

      - name: Verify syntax and patch hygiene
        run: |
          python -m compileall -q hermes-agency
          git diff --check

      - name: Commit diagnostics
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Runtime alignment and diagnostics are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes-agency apps/fabric/docker apps/fabric/scripts docs/audits
          git commit -m "fix(deps): align Hermes Agent 0.18.0 references"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
