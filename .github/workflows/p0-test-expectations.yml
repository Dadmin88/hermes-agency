name: P0 Test Expectations

on:
  pull_request:
    branches:
      - diagnostic/p0-test-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-tests:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-keryx-test-expectations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-keryx-test-expectations
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stale Keryx expectations
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("hermes-agency/tests/test_unit.py")
          text = path.read_text(encoding="utf-8")

          daemon_replacement = '''def test_resolve_daemon_bin_uses_only_explicit_config(plugin_modules, tmp_path):
              nm = plugin_modules.node_manager
              cfg_mod = plugin_modules.config
              configured = tmp_path / "configured" / "agentanycastd"
              configured.parent.mkdir(parents=True)
              configured.write_text("configured", encoding="utf-8")

              nm.get_config = lambda: cfg_mod.AgencyConfig(daemon_bin=configured)
              assert nm._resolve_daemon_bin() == configured

              configured.unlink()
              assert nm._resolve_daemon_bin() is None
          '''

          if "def test_resolve_daemon_bin_uses_only_explicit_config" not in text:
              text, count = re.subn(
                  r"def test_resolve_daemon_bin_prefers_config_then_protected_copy\(.*?(?=\n\ndef test_check_agency_available)",
                  daemon_replacement.rstrip(),
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f"daemon resolver test boundary match count={count}")

          old_info = '''        "transport_backend": "agentanycast",
              "effective_transport_backend": "agentanycast",
          '''
          new_info = '''        "transport_backend": "keryx",
              "effective_transport_backend": "keryx",
          '''
          if old_info in text:
              text = text.replace(old_info, new_info, 1)
          elif new_info not in text:
              raise SystemExit("compact info expectation block changed unexpectedly")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Format and verify
        run: |
          ruff check hermes-agency/tests/test_unit.py --fix
          ruff format hermes-agency/tests/test_unit.py
          make test-agency

      - name: Commit test updates
        run: |
          if git diff --quiet; then
            echo "Test expectations are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes-agency/tests/test_unit.py
          git commit -m "test(agency): align expectations with Keryx-first defaults"
          git push origin HEAD:fix/p0-keryx-test-expectations
