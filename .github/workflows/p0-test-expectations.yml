name: P0 Test Expectations

on:
  pull_request:
    branches:
      - diagnostic/p0-test-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-tests:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-keryx-test-expectations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-keryx-test-expectations
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stale Keryx expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hermes-agency/tests/test_unit.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          start = next(
              i
              for i, line in enumerate(lines)
              if line.startswith("def test_resolve_daemon_bin_prefers_config_then_protected_copy")
              or line.startswith("def test_resolve_daemon_bin_uses_only_explicit_config")
          )
          end = next(
              i
              for i, line in enumerate(lines[start + 1 :], start + 1)
              if line.startswith("def test_check_agency_available")
          )
          daemon_block = [
              "def test_resolve_daemon_bin_uses_only_explicit_config(plugin_modules, tmp_path):",
              "    nm = plugin_modules.node_manager",
              "    cfg_mod = plugin_modules.config",
              '    configured = tmp_path / "configured" / "agentanycastd"',
              "    configured.parent.mkdir(parents=True)",
              '    configured.write_text("configured", encoding="utf-8")',
              "",
              "    nm.get_config = lambda: cfg_mod.AgencyConfig(daemon_bin=configured)",
              "    assert nm._resolve_daemon_bin() == configured",
              "",
              "    configured.unlink()",
              "    assert nm._resolve_daemon_bin() is None",
              "",
              "",
          ]
          lines[start:end] = daemon_block

          info_start = next(
              i
              for i, line in enumerate(lines)
              if line.startswith("def test_a2a_info_compact_uses_compact_node_payload")
          )
          info_end = next(
              i
              for i, line in enumerate(lines[info_start + 1 :], info_start + 1)
              if line.startswith("def test_a2a_discover_uses_compact_node_payload")
          )
          for i in range(info_start, info_end):
              if '"transport_backend":' in lines[i]:
                  lines[i] = '        "transport_backend": "keryx",'
              elif '"effective_transport_backend":' in lines[i]:
                  lines[i] = '        "effective_transport_backend": "keryx",'

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Format and verify
        run: |
          ruff check hermes-agency/tests/test_unit.py --fix
          ruff format hermes-agency/tests/test_unit.py
          make test-agency

      - name: Commit test updates
        run: |
          if git diff --quiet; then
            echo "Test expectations are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes-agency/tests/test_unit.py
          git commit -m "test(agency): align expectations with Keryx-first defaults"
          git push origin HEAD:fix/p0-keryx-test-expectations
