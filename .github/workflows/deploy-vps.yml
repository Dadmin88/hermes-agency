name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/Hermes_Agency
            # Pull latest so the auto-update script is current
            git fetch origin main
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)
            if [ "$LOCAL" = "$REMOTE" ]; then
              echo "Already up to date ($LOCAL)"
            else
              git pull --ff-only origin main
              echo "Pulled $(git rev-parse --short HEAD)"
            fi
            # Now run the shared auto-update script for gateway restarts
            bash scripts/auto-update.sh
            echo "--- Status ---"
            PATH="$HOME/.local/bin:$PATH" hermes agency status 2>&1 | head -10
