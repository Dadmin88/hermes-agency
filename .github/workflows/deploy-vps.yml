name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail

            REPO_DIR="${DEPLOY_REPO_DIR:-}"
            if [ -z "$REPO_DIR" ]; then
              for candidate in "$HOME/repos/Hermes_Agency" "$HOME/Hermes_Agency"; do
                if [ -d "$candidate/.git" ]; then
                  REPO_DIR="$candidate"
                  break
                fi
              done
            fi
            if [ -z "$REPO_DIR" ] || [ ! -d "$REPO_DIR/.git" ]; then
              echo "ERROR: Hermes_Agency checkout not found" >&2
              exit 1
            fi
            cd "$REPO_DIR"

            git fetch origin main
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)
            if [ "$LOCAL" = "$REMOTE" ]; then
              echo "Already up to date ($LOCAL)"
            else
              if [ -n "$(git status --porcelain)" ]; then
                git stash push --include-untracked -m "deploy auto-stash before update $(date +%s)"
                echo "Stashed local checkout changes before deploy"
              fi
              git pull --ff-only origin main
              echo "Pulled $(git rev-parse --short HEAD)"
            fi

            echo "--- Restart gateway ---"
            if systemctl --user list-unit-files hermes-gateway.service --no-pager | grep -q '^hermes-gateway.service'; then
              systemctl --user --no-block restart hermes-gateway.service
            else
              echo "ERROR: hermes-gateway.service is not installed" >&2
              exit 1
            fi

            echo "--- Status ---"
            for attempt in $(seq 1 72); do
              state=$(systemctl --user is-active hermes-gateway.service || true)
              echo "hermes-gateway.service state: $state (attempt $attempt/72)"
              if [ "$state" = "active" ]; then
                break
              fi
              if [ "$state" = "failed" ]; then
                systemctl --user status hermes-gateway.service --no-pager -l || true
                exit 1
              fi
              sleep 5
            done
            systemctl --user is-active hermes-gateway.service
            pgrep -af "hermes_cli.main gateway run|agentanycastd --config=.*/profiles/agency-orchestrator" | head -10 || true
