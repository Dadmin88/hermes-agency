name: P0 Doc Runtime Alignment

on:
  pull_request:
    branches:
      - diagnostic/p0-doc-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  align-docs:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-doc-runtime-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-doc-runtime-alignment
          fetch-depth: 0

      - name: Align current Hermes Agent requirements and fallback language
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              "hermes-agency/README.md": [
                  ("`hermes-agent>=0.17.0`", "`hermes-agent>=0.18.0`"),
                  (
                      "When `transport_backend: keryx` is configured but the Keryx SDK is not importable, the plugin falls back to AgentAnycast compatibility when available.",
                      "When `transport_backend: keryx` is selected but the Keryx SDK is not importable, Agency reports the selected transport as unavailable rather than silently switching backends.",
                  ),
              ],
              "apps/fabric/docker/hermes-gateway-smoke/Dockerfile": [
                  ("ARG HERMES_VERSION=0.17.0", "ARG HERMES_VERSION=0.18.0"),
              ],
              "apps/fabric/scripts/smoke/hermes-gateway-e2e.sh": [
                  ('HERMES_VERSION="${HERMES_VERSION:-0.17.0}"', 'HERMES_VERSION="${HERMES_VERSION:-0.18.0}"'),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f"{filename}: expected source text not found: {old}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify consistency and patch hygiene
        run: |
          ! grep -R --line-number --fixed-strings '0.17.0' \
            hermes-agency/README.md \
            apps/fabric/docker/hermes-gateway-smoke/Dockerfile \
            apps/fabric/scripts/smoke/hermes-gateway-e2e.sh
          ! grep -F 'falls back to AgentAnycast compatibility when available' hermes-agency/README.md
          git diff --check

      - name: Commit aligned docs
        run: |
          if git diff --quiet; then
            echo "Documentation is already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes-agency/README.md apps/fabric/docker/hermes-gateway-smoke/Dockerfile apps/fabric/scripts/smoke/hermes-gateway-e2e.sh
          git commit -m "docs: align Hermes Agent 0.18 and Keryx failure semantics"
          git push origin HEAD:fix/p0-doc-runtime-alignment
