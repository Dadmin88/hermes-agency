name: Agency Phase 17 Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agency-phase17-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-and-verify:
    if: github.head_ref == 'feat/phase17-agency-live-roundtrip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Checkout reviewed Keryx revision
        uses: actions/checkout@v4
        with:
          repository: DeployFaith/hermes-keryx
          ref: ada02506293630f824d01d1e9267088a05caf6f9
          path: .phase17-keryx

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronize Keryx Python SDK
        run: |
          python scripts/sync_keryx_sdk.py \
            --source .phase17-keryx/sdk/python/keryx \
            --revision ada02506293630f824d01d1e9267088a05caf6f9
          rm -rf .phase17-keryx

      - name: Install Agency development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify synchronized transport
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q src/keryx hermes-agency
            python -m pytest hermes-agency/tests/test_keryx_transport.py -q
            make test-agency
            ruff check hermes-agency scripts/sync_keryx_sdk.py
            ruff format --check scripts/sync_keryx_sdk.py
          } 2>&1 | tee agency-phase17-build.log

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agency-phase17-build-log
          path: agency-phase17-build.log
          if-no-files-found: error

      - name: Commit verified SDK synchronization
        if: success()
        run: |
          if git diff --quiet; then
            echo 'No SDK synchronization changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/keryx scripts/sync_keryx_sdk.py
          git commit -m 'feat(agency): synchronize the authenticated Phase 17 Keryx SDK'
          git push origin HEAD:${{ github.head_ref }}
