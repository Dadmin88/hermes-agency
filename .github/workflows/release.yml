name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,pool]"
      - name: SDK non-integration suite
        run: make test-sdk
      - name: Agency non-integration suite
        run: make test-agency

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag target is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Install and smoke-test release wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -c "import hermes_agency; import keryx"
          .wheel-smoke/bin/hermes-agency --help
          .wheel-smoke/bin/python - <<'PY'
          import json
          from importlib.resources import files
          import yaml

          root = files("hermes_agency")
          manifest = root.joinpath("default_staff", "manifest.json")
          profile = root.joinpath("default_staff", "profiles", "agency-orchestrator", "SOUL.md")
          model_set = root.joinpath("model_sets", "openai-codex-only.yaml")
          assert manifest.is_file(), "default staff manifest missing from wheel"
          assert profile.is_file() and profile.read_text(encoding="utf-8").strip(), "default staff profile missing from wheel"
          assert model_set.is_file(), "canonical model set missing from wheel"
          assert json.loads(manifest.read_text(encoding="utf-8"))["total_profiles"] == 83
          assert yaml.safe_load(model_set.read_text(encoding="utf-8"))["name"] == "openai-codex-only"
          PY
          .wheel-smoke/bin/python -m pip check

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
