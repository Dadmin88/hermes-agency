name: Fabric Rebrand Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fabric-rebrand-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebrand-fabric:
    if: github.head_ref == 'feat/fabric-remove-paperclip-brand'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Apply complete namespace migration
        run: |
          python scripts/accelerate_fabric_rebrand.py
          python scripts/apply_fabric_namespace_rebrand.py
      - name: Normalize workspace lockfile
        working-directory: apps/fabric
        run: pnpm install --lockfile-only
      - name: Scan for inherited product references
        id: brand_scan
        shell: bash
        run: |
          set +e
          : > fabric-rebrand-scan.log
          git grep -Iin 'paperclip' -- . \
            ':!apps/fabric/LICENSE' \
            ':!apps/fabric/NOTICE' \
            ':!scripts/apply_fabric_namespace_rebrand.py' \
            ':!scripts/accelerate_fabric_rebrand.py' \
            ':!.github/workflows/fabric-rebrand-builder.yml' \
            | tee -a fabric-rebrand-scan.log
          content_status=${PIPESTATUS[0]}
          find . -path './.git' -prune -o -iname '*paperclip*' -print \
            | tee -a fabric-rebrand-scan.log
          path_status=${PIPESTATUS[0]}
          if [[ "$content_status" -eq 0 ]] || [[ -s fabric-rebrand-scan.log ]]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload product-reference scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-rebrand-scan
          path: fabric-rebrand-scan.log
          if-no-files-found: error
      - name: Install workspace dependencies
        if: steps.brand_scan.outputs.clean == 'true'
        working-directory: apps/fabric
        run: pnpm install --frozen-lockfile
      - name: Verify Fabric workspace
        if: steps.brand_scan.outputs.clean == 'true'
        id: verify
        working-directory: apps/fabric
        shell: bash
        run: |
          set +e
          {
            pnpm run check:branding
            pnpm run preflight:workspace-links
            pnpm run typecheck
            pnpm run test:run
            pnpm run build
          } 2>&1 | tee ../../fabric-rebrand-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-rebrand-build-log
          path: fabric-rebrand-build.log
          if-no-files-found: ignore
      - name: Commit verified rebrand
        if: steps.brand_scan.outputs.clean == 'true' && steps.verify.outputs.status == '0'
        run: |
          if git diff --quiet; then
            echo 'No rebrand changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(fabric): remove inherited legacy namespace'
          git push origin HEAD:${{ github.head_ref }}
      - name: Fail inherited product references
        if: steps.brand_scan.outputs.clean != 'true'
        run: |
          echo 'Inherited product references remain; inspect the fabric-rebrand-scan artifact.'
          exit 1
      - name: Fail unsuccessful verification
        if: steps.brand_scan.outputs.clean == 'true' && steps.verify.outputs.status != '0'
        run: exit 1
