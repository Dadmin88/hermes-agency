name: Fabric Rebrand Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fabric-rebrand-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebrand-fabric:
    if: github.head_ref == 'feat/fabric-remove-paperclip-brand'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Apply namespace migration and semantic repairs
        run: |
          python scripts/accelerate_fabric_rebrand.py
          python scripts/apply_fabric_namespace_rebrand.py
          python scripts/fix_fabric_rebrand_semantics.py
          python scripts/fix_fabric_cli_alias.py
          python scripts/fix_fabric_final_contracts.py
          python scripts/fix_fabric_ui_contracts.py
      - name: Finalize exact UI contracts after migration
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          ui = Path("apps/fabric/ui/src")

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding="utf-8")

          public_files = (
              "components/BootstrapPendingPage.tsx",
              "components/SidebarAccountMenu.tsx",
              "pages/CloudUpstream.tsx",
              "pages/CompanyAccess.tsx",
              "pages/InviteLanding.tsx",
              "pages/Secrets.tsx",
              "pages/secrets/ImportFromVaultDialog.tsx",
          )
          for relative in public_files:
              path = ui / relative
              text = path.read_text(encoding="utf-8")
              text = text.replace("HermesFabric", "Hermes Fabric")
              text = text.replace("Hermes Agency", "Hermes Fabric")
              write(path, text)

          cloud = ui / "pages/CloudUpstream.tsx"
          text = cloud.read_text(encoding="utf-8")
          text = re.sub(
              r'aria-label="[^"]*Cloud stack URL"',
              'aria-label="Hermes Fabric Cloud stack URL"',
              text,
          )
          write(cloud, text)

          import_dialog = ui / "pages/secrets/ImportFromVaultDialog.tsx"
          text = import_dialog.read_text(encoding="utf-8")
          text = text.replace("A Hermes Fabric secret already uses this name.", "A Fabric secret already uses this name.")
          text = text.replace("A Hermes Fabric secret already uses this key.", "A Fabric secret already uses this key.")
          write(import_dialog, text)

          fixture_files = (
              "components/MarkdownBody.test.tsx",
              "components/MarkdownEditor.test.tsx",
              "components/SearchableSelect.test.tsx",
              "pages/CompanyAccess.test.tsx",
              "pages/CloudUpstream.test.tsx",
              "pages/InviteLanding.test.tsx",
              "pages/Secrets.render.test.tsx",
              "pages/secrets/ImportFromVaultDialog.test.tsx",
              "lib/reusable-execution-workspaces.test.ts",
          )
          for relative in fixture_files:
              path = ui / relative
              text = path.read_text(encoding="utf-8")
              text = text.replace("HermesFabric", "Hermes Fabric")
              write(path, text)

          secrets_test = ui / "pages/Secrets.render.test.tsx"
          text = secrets_test.read_text(encoding="utf-8")
          text = text.replace("Hermes FabricSampleCount", "HermesFabricSampleCount")
          write(secrets_test, text)

          editor = ui / "components/MarkdownEditor.test.tsx"
          text = editor.read_text(encoding="utf-8")
          query_line = "    const query = `@${matchText.slice(0, 3)}`;\n"
          text = text.replace(query_line, "")
          function_start = text.index("async function openMentionMenuFor(")
          root_anchor = "    const root = createRoot(container);\n"
          root_index = text.index(root_anchor, function_start)
          text = text[:root_index] + query_line + text[root_index:]
          prefix = text[:function_start]
          helper = text[function_start:]
          helper = re.sub(r'value="@[^"]+"', "value={query}", helper, count=1)
          helper = re.sub(
              r'range\.setStart\(textNode!,\s*"@[^"]+"\.length\);',
              "range.setStart(textNode!, query.length);",
              helper,
              count=1,
          )
          write(editor, prefix + helper)

          agents = ui / "pages/Agents.test.tsx"
          text = agents.read_text(encoding="utf-8")
          text = re.sub(
              r'container\.querySelector\([^\n;]*w-56[^\n;]*\)',
              'container.querySelector(\'[class~="sm:w-56"]\')',
              text,
              count=1,
          )
          write(agents, text)

          cloud_test = ui / "pages/CloudUpstream.test.tsx"
          text = cloud_test.read_text(encoding="utf-8")
          text = re.sub(
              r"input\[aria-label='[^']*Cloud stack URL'\]",
              "input[aria-label='Hermes Fabric Cloud stack URL']",
              text,
              count=1,
          )
          write(cloud_test, text)

          import_test = ui / "pages/secrets/ImportFromVaultDialog.test.tsx"
          text = import_test.read_text(encoding="utf-8")
          text = text.replace("a hermes fabric secret already uses this", "a fabric secret already uses this")
          write(import_test, text)
          PY
      - name: Normalize workspace lockfile
        working-directory: apps/fabric
        run: pnpm install --lockfile-only
      - name: Scan for inherited product references
        id: brand_scan
        shell: bash
        run: |
          set +e
          : > fabric-rebrand-scan.log
          git grep -Iin 'paperclip' -- . \
            ':!apps/fabric/LICENSE' \
            ':!apps/fabric/NOTICE' \
            ':!scripts/apply_fabric_namespace_rebrand.py' \
            ':!scripts/accelerate_fabric_rebrand.py' \
            ':!scripts/fix_fabric_rebrand_semantics.py' \
            ':!scripts/fix_fabric_cli_alias.py' \
            ':!scripts/fix_fabric_final_contracts.py' \
            ':!scripts/fix_fabric_ui_contracts.py' \
            ':!.github/workflows/fabric-rebrand-builder.yml' \
            | tee -a fabric-rebrand-scan.log
          content_status=${PIPESTATUS[0]}
          find . -path './.git' -prune -o -iname '*paperclip*' -print \
            | tee -a fabric-rebrand-scan.log
          if [[ "$content_status" -eq 0 ]] || [[ -s fabric-rebrand-scan.log ]]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload product-reference scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-rebrand-scan
          path: fabric-rebrand-scan.log
          if-no-files-found: error
      - name: Fail inherited product references
        if: steps.brand_scan.outputs.clean != 'true'
        run: |
          echo 'Inherited product references remain; inspect the fabric-rebrand-scan artifact.'
          exit 1
      - name: Install workspace dependencies
        if: steps.brand_scan.outputs.clean == 'true'
        working-directory: apps/fabric
        run: timeout 15m pnpm install --frozen-lockfile --reporter=append-only
      - name: Verify Fabric workspace
        if: steps.brand_scan.outputs.clean == 'true'
        working-directory: apps/fabric
        shell: bash
        run: |
          set -o pipefail
          (
            pnpm run check:branding &&
            pnpm run preflight:workspace-links &&
            pnpm run typecheck &&
            pnpm run test:run &&
            pnpm run build
          ) 2>&1 | tee ../../fabric-rebrand-build.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-rebrand-build-log
          path: fabric-rebrand-build.log
          if-no-files-found: ignore
      - name: Commit verified rebrand
        if: success() && steps.brand_scan.outputs.clean == 'true'
        run: |
          if git diff --quiet; then
            echo 'No rebrand changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(fabric): remove inherited upstream namespace'
          git push origin HEAD:${{ github.head_ref }}
