name: Fabric Rebrand Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fabric-rebrand-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebrand-fabric:
    if: github.head_ref == 'feat/fabric-remove-paperclip-brand'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Apply namespace migration and semantic repairs
        run: |
          python scripts/accelerate_fabric_rebrand.py
          python scripts/apply_fabric_namespace_rebrand.py
          python scripts/fix_fabric_rebrand_semantics.py
      - name: Enforce attachment icon repair
        run: |
          files=(
            apps/fabric/ui/src/components/ChatComposer.tsx
            apps/fabric/ui/src/components/CommentThread.tsx
            apps/fabric/ui/src/components/IssueAttachmentsSection.tsx
            apps/fabric/ui/src/components/IssueChatThread.tsx
            apps/fabric/ui/src/components/NewIssueDialog.tsx
            apps/fabric/ui/src/components/artifacts/ArtifactCard.tsx
            apps/fabric/ui/src/components/search/SearchResultRow.tsx
            apps/fabric/ui/src/pages/IssueDetail.tsx
            apps/fabric/ui/src/pages/Pipelines.tsx
            apps/fabric/ui/storybook/stories/assigned-backlog-safeguards.stories.tsx
          )
          sed -i 's/HermesFabric/Link2/g' "${files[@]}"
          if grep -n 'HermesFabric' "${files[@]}"; then
            echo 'Attachment icon repair did not complete'
            exit 1
          fi
      - name: Normalize workspace lockfile
        working-directory: apps/fabric
        run: pnpm install --lockfile-only
      - name: Scan for inherited product references
        id: brand_scan
        shell: bash
        run: |
          set +e
          : > fabric-rebrand-scan.log
          git grep -Iin 'paperclip' -- . \
            ':!apps/fabric/LICENSE' \
            ':!apps/fabric/NOTICE' \
            ':!scripts/apply_fabric_namespace_rebrand.py' \
            ':!scripts/accelerate_fabric_rebrand.py' \
            ':!scripts/fix_fabric_rebrand_semantics.py' \
            ':!.github/workflows/fabric-rebrand-builder.yml' \
            | tee -a fabric-rebrand-scan.log
          content_status=${PIPESTATUS[0]}
          find . -path './.git' -prune -o -iname '*paperclip*' -print \
            | tee -a fabric-rebrand-scan.log
          if [[ "$content_status" -eq 0 ]] || [[ -s fabric-rebrand-scan.log ]]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload product-reference scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-rebrand-scan
          path: fabric-rebrand-scan.log
          if-no-files-found: error
      - name: Fail inherited product references
        if: steps.brand_scan.outputs.clean != 'true'
        run: |
          echo 'Inherited product references remain; inspect the fabric-rebrand-scan artifact.'
          exit 1
      - name: Install workspace dependencies
        if: steps.brand_scan.outputs.clean == 'true'
        working-directory: apps/fabric
        run: pnpm install --frozen-lockfile
      - name: Verify Fabric workspace
        if: steps.brand_scan.outputs.clean == 'true'
        working-directory: apps/fabric
        shell: bash
        run: |
          set -o pipefail
          (
            pnpm run check:branding &&
            pnpm run preflight:workspace-links &&
            pnpm run typecheck &&
            pnpm run test:run &&
            pnpm run build
          ) 2>&1 | tee ../../fabric-rebrand-build.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-rebrand-build-log
          path: fabric-rebrand-build.log
          if-no-files-found: ignore
      - name: Commit verified rebrand
        if: success() && steps.brand_scan.outputs.clean == 'true'
        run: |
          if git diff --quiet; then
            echo 'No rebrand changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(fabric): remove inherited legacy namespace'
          git push origin HEAD:${{ github.head_ref }}
