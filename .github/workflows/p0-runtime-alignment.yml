name: P0 Runtime Alignment

on:
  push:
    branches:
      - fix/p0-product-truth-keryx-alignment

permissions:
  contents: write

jobs:
  align-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-product-truth-keryx-alignment
          fetch-depth: 0

      - name: Apply asserted Keryx-first runtime changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n--- OLD ---\n{old}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "hermes-agency/config.py",
              '    transport_backend: str = "agentanycast"\n',
              '    transport_backend: str = "keryx"\n',
          )

          replace_once(
              "hermes-agency/config.py",
              '''def _transport_backend_config(config: dict[str, Any]) -> str:
              """Return the configured Agency transport backend with backward-compatible defaults."""

              raw_backend = (
                  str(
                      _cfg_get(config, "agency", "transport_backend", default="agentanycast")
                      or "agentanycast"
                  )
                  .strip()
                  .lower()
              )
              aliases = {
                  "agent-anycast": "agentanycast",
                  "agent_anycast": "agentanycast",
                  "anycast": "agentanycast",
              }
              backend = aliases.get(raw_backend, raw_backend)
              if backend not in {"agentanycast", "keryx"}:
                  logger.warning(
                      "Unsupported agency.transport_backend=%r; falling back to agentanycast", raw_backend
                  )
                  return "agentanycast"
              return backend
          ''',
              '''def _transport_backend_config(config: dict[str, Any]) -> str:
              """Return the configured Agency transport backend with Keryx-first defaults."""

              raw_backend = (
                  str(_cfg_get(config, "agency", "transport_backend", default="keryx") or "keryx")
                  .strip()
                  .lower()
              )
              aliases = {
                  "agent-anycast": "agentanycast",
                  "agent_anycast": "agentanycast",
                  "anycast": "agentanycast",
              }
              backend = aliases.get(raw_backend, raw_backend)
              if backend not in {"agentanycast", "keryx"}:
                  logger.warning(
                      "Unsupported agency.transport_backend=%r; falling back to keryx", raw_backend
                  )
                  return "keryx"
              return backend
          ''',
          )

          replace_once(
              "hermes-agency/tools.py",
              '''def get_transport_backend() -> str:
              """Return configured Agency transport backend, defaulting to agentanycast."""

              try:
                  from .config import get_config

                  backend = getattr(get_config(), "transport_backend", "agentanycast")
              except Exception:
                  logger.debug("Failed to load Agency transport backend from config", exc_info=True)
                  backend = "agentanycast"
              normalized = str(backend or "agentanycast").strip().lower()
              aliases = {
                  "agent-anycast": "agentanycast",
                  "agent_anycast": "agentanycast",
                  "anycast": "agentanycast",
              }
              normalized = aliases.get(normalized, normalized)
              if normalized not in {"agentanycast", "keryx"}:
                  logger.warning(
                      "Unsupported agency.transport_backend=%r; falling back to agentanycast", backend
                  )
                  return "agentanycast"
              return normalized
          ''',
              '''def get_transport_backend() -> str:
              """Return configured Agency transport backend, defaulting to Keryx."""

              try:
                  from .config import get_config

                  backend = getattr(get_config(), "transport_backend", "keryx")
              except Exception:
                  logger.debug("Failed to load Agency transport backend from config", exc_info=True)
                  backend = "keryx"
              normalized = str(backend or "keryx").strip().lower()
              aliases = {
                  "agent-anycast": "agentanycast",
                  "agent_anycast": "agentanycast",
                  "anycast": "agentanycast",
              }
              normalized = aliases.get(normalized, normalized)
              if normalized not in {"agentanycast", "keryx"}:
                  logger.warning(
                      "Unsupported agency.transport_backend=%r; falling back to keryx", backend
                  )
                  return "keryx"
              return normalized
          ''',
          )

          replace_once(
              "hermes-agency/tools.py",
              '''def get_effective_transport_backend() -> str:
              """Return the transport backend this process will actually use."""

              backend = get_transport_backend()
              if backend == "keryx":
                  if check_keryx_available():
                      _configure_keryx_environment()
                      return "keryx"
                  logger.warning(
                      "Keryx transport requested but SDK unavailable; falling back to agentanycast"
                  )
              return "agentanycast"


          def check_agency_available() -> bool:
              """Return True when the selected Hermes Agency transport SDK is importable."""

              effective_backend = get_effective_transport_backend()
              if effective_backend == "keryx":
                  return True
              return importlib.util.find_spec("agentanycast") is not None
          ''',
              '''def get_effective_transport_backend() -> str:
              """Return the configured backend without silently changing transports."""

              backend = get_transport_backend()
              if backend == "keryx" and check_keryx_available():
                  _configure_keryx_environment()
              elif backend == "keryx":
                  logger.warning("Keryx transport requested but SDK unavailable")
              return backend


          def check_agency_available() -> bool:
              """Return True when the explicitly selected Agency transport SDK is importable."""

              effective_backend = get_effective_transport_backend()
              if effective_backend == "keryx":
                  return check_keryx_available()
              return importlib.util.find_spec("agentanycast") is not None
          ''',
          )

          replace_once(
              "hermes-agency/node_manager.py",
              '''def _normalize_transport_backend(value: Any) -> str:
              """Normalize configured transport backend with AgentAnycast fallback."""

              backend = str(value or "agentanycast").strip().lower()
              backend = _TRANSPORT_BACKEND_ALIASES.get(backend, backend)
              if backend not in {"agentanycast", "keryx"}:
                  logger.warning(
                      "Unsupported agency.transport_backend=%r; falling back to agentanycast", value
                  )
                  return "agentanycast"
              return backend


          def _transport_backend_for_config(cfg: AgencyConfig | None = None) -> str:
              """Return the configured transport backend for ``cfg`` or current config."""

              try:
                  active_cfg = cfg or get_config()
                  return _normalize_transport_backend(
                      getattr(active_cfg, "transport_backend", "agentanycast")
                  )
              except Exception:
                  logger.debug("Failed to load Agency transport backend from config", exc_info=True)
                  return "agentanycast"
          ''',
              '''def _normalize_transport_backend(value: Any) -> str:
              """Normalize configured transport backend with a Keryx-first fallback."""

              backend = str(value or "keryx").strip().lower()
              backend = _TRANSPORT_BACKEND_ALIASES.get(backend, backend)
              if backend not in {"agentanycast", "keryx"}:
                  logger.warning(
                      "Unsupported agency.transport_backend=%r; falling back to keryx", value
                  )
                  return "keryx"
              return backend


          def _transport_backend_for_config(cfg: AgencyConfig | None = None) -> str:
              """Return the configured transport backend for ``cfg`` or current config."""

              try:
                  active_cfg = cfg or get_config()
                  return _normalize_transport_backend(getattr(active_cfg, "transport_backend", "keryx"))
              except Exception:
                  logger.debug("Failed to load Agency transport backend from config", exc_info=True)
                  return "keryx"
          ''',
          )

          replace_once(
              "hermes-agency/node_manager.py",
              '''def _resolve_transport_node_class(cfg: AgencyConfig) -> tuple[type[Any], str]:
              """Return the configured SDK node class and effective backend name."""

              backend = _transport_backend_for_config(cfg)
              if backend == "keryx":
                  try:
                      _configure_keryx_environment(cfg)
                      from keryx.node import KeryxNode

                      return KeryxNode, "keryx"
                  except Exception:
                      logger.warning(
                          "Keryx transport requested but SDK unavailable; falling back to agentanycast",
                          exc_info=True,
                      )

              from keryx import KeryxNode as Node

              return Node, "agentanycast"
          ''',
              '''def _resolve_transport_node_class(cfg: AgencyConfig) -> tuple[type[Any], str]:
              """Return the node class for the explicitly selected transport backend."""

              backend = _transport_backend_for_config(cfg)
              if backend == "keryx":
                  _configure_keryx_environment(cfg)
                  try:
                      from keryx.node import KeryxNode
                  except Exception as exc:
                      raise RuntimeError("Keryx transport requested but SDK unavailable") from exc
                  return KeryxNode, "keryx"

              try:
                  from agentanycast import Node
              except Exception as exc:
                  raise RuntimeError("AgentAnycast transport requested but SDK unavailable") from exc
              return Node, "agentanycast"
          ''',
          )

          replace_once(
              "hermes-agency/node_manager.py",
              '''def _resolve_daemon_bin() -> Any | None:
              """Resolve the daemon binary path without allowing SDK overwrite of fixed builds.

              Preference order:

              1. ``agency.daemon_bin`` config override, when it exists.
              2. Protected repository copy at ``~/src/hermes-agentanycast/bin/agentanycastd``.
              3. ``None``, which lets the SDK manage/download the daemon as a fallback.
              """

              cfg = get_config()
              if cfg.daemon_bin and cfg.daemon_bin.exists():
                  return cfg.daemon_bin

              protected = os.path.expanduser("~/src/hermes-agentanycast/bin/agentanycastd")
              if os.path.exists(protected):
                  return protected

              return None
          ''',
              '''def _resolve_daemon_bin() -> Any | None:
              """Return an explicit legacy AgentAnycast daemon override when configured."""

              cfg = get_config()
              if cfg.daemon_bin and cfg.daemon_bin.exists():
                  return cfg.daemon_bin
              return None
          ''',
          )

          replace_once(
              "hermes-agency/pool/roster.py",
              '''def _transport_backend() -> str:
              """Return the configured pool transport backend."""

              try:
                  from ..config import get_config

                  backend = str(getattr(get_config(), "transport_backend", "agentanycast") or "agentanycast")
              except Exception:
                  backend = str(
                      os.environ.get("HERMES_AGENCY_TRANSPORT_BACKEND")
                      or os.environ.get("AGENCY_TRANSPORT_BACKEND")
                      or "agentanycast"
                  )
              backend = backend.strip().lower().replace("_", "-")
              if backend in {"keryx", "hermes-keryx"}:
                  return "keryx"
              return "agentanycast"
          ''',
              '''def _transport_backend() -> str:
              """Return the configured pool transport backend, defaulting to Keryx."""

              try:
                  from ..config import get_config

                  backend = str(getattr(get_config(), "transport_backend", "keryx") or "keryx")
              except Exception:
                  backend = str(
                      os.environ.get("HERMES_AGENCY_TRANSPORT_BACKEND")
                      or os.environ.get("AGENCY_TRANSPORT_BACKEND")
                      or "keryx"
                  )
              backend = backend.strip().lower().replace("_", "-")
              if backend in {"agentanycast", "agent-anycast", "anycast"}:
                  return "agentanycast"
              return "keryx"
          ''',
          )

          replace_once(
              "hermes-agency/pool/manager.py",
              '''def _transport_backend() -> str:
              """Return the configured pool transport backend, defaulting to AgentAnycast."""

              try:
                  from ..config import get_config

                  backend = str(getattr(get_config(), "transport_backend", "agentanycast") or "agentanycast")
              except Exception:
                  backend = str(
                      os.environ.get("HERMES_AGENCY_TRANSPORT_BACKEND")
                      or os.environ.get("AGENCY_TRANSPORT_BACKEND")
                      or "agentanycast"
                  )
              backend = backend.strip().lower().replace("_", "-")
              if backend in {"keryx", "hermes-keryx"}:
                  return "keryx"
              return "agentanycast"
          ''',
              '''def _transport_backend() -> str:
              """Return the configured pool transport backend, defaulting to Keryx."""

              try:
                  from ..config import get_config

                  backend = str(getattr(get_config(), "transport_backend", "keryx") or "keryx")
              except Exception:
                  backend = str(
                      os.environ.get("HERMES_AGENCY_TRANSPORT_BACKEND")
                      or os.environ.get("AGENCY_TRANSPORT_BACKEND")
                      or "keryx"
                  )
              backend = backend.strip().lower().replace("_", "-")
              if backend in {"agentanycast", "agent-anycast", "anycast"}:
                  return "agentanycast"
              return "keryx"
          ''',
          )

          replace_once(
              "hermes-agency/pool/manager.py",
              '''    """Route an outbound pool task through the configured transport.

              AgentAnycast remains the default/fallback.  When ``transport_backend=keryx``
              is configured, install Keryx's compatibility transport before touching the
              singleton NodeManager so ``send_task_sync`` delivers via Keryx's daemon/relay
              path instead of the legacy AgentAnycast daemon.
              """
          ''',
              '''    """Route an outbound pool task through the explicitly selected transport.

              Keryx is the default. AgentAnycast is used only when legacy mode is selected.
              The singleton NodeManager owns the actual transport implementation.
              """
          ''',
          )

          replace_once(
              "hermes-agency/pool/manager.py",
              '''        """Return a Hermes-current provider/model pair for worker profiles.

              Older pool configs used provider names such as ``openai``/``xai`` that
              are no longer valid on this VPS Hermes install. Kanban workers exit rc=0
              before loading tools when the provider is invalid, which the dispatcher
              records as a protocol violation. Keep the pool safe by defaulting every
              agency worker to the known-good OpenAI Codex OAuth provider.
              """
          ''',
              '''        """Return a normalized provider/model pair for worker profiles.

              Older pool configs may use deprecated provider aliases. Normalize them so
              workers reach Hermes with a supported provider name instead of failing
              before tool loading.
              """
          ''',
          )

          test_file = Path("hermes-agency/tests/test_keryx_transport.py")
          test_text = test_file.read_text(encoding="utf-8")
          addition = '''

          def test_transport_defaults_to_keryx_when_setting_is_absent(plugin_tools):
              plugin_tools["config"].load_config = lambda: {}

              assert plugin_tools["config"].get_config().transport_backend == "keryx"
              assert plugin_tools["tools"].get_transport_backend() == "keryx"


          def test_invalid_transport_name_falls_back_to_keryx(plugin_tools):
              plugin_tools["config"].load_config = lambda: {
                  "agency": {"transport_backend": "not-a-transport"}
              }

              assert plugin_tools["config"].get_config().transport_backend == "keryx"
              assert plugin_tools["tools"].get_transport_backend() == "keryx"


          def test_keryx_unavailable_is_reported_without_transport_switch(plugin_tools, monkeypatch):
              monkeypatch.setattr(plugin_tools["tools"], "check_keryx_available", lambda: False)

              assert plugin_tools["tools"].get_effective_transport_backend() == "keryx"
              assert plugin_tools["tools"].check_agency_available() is False


          def test_explicit_agentanycast_selects_legacy_node_class(
              node_manager_module, monkeypatch
          ):
              class LegacyNode:
                  pass

              legacy_module = types.ModuleType("agentanycast")
              legacy_module.__spec__ = importlib.machinery.ModuleSpec("agentanycast", loader=None)
              legacy_module.Node = LegacyNode
              monkeypatch.setitem(sys.modules, "agentanycast", legacy_module)

              node_cls, backend = node_manager_module._resolve_transport_node_class(
                  types.SimpleNamespace(transport_backend="agentanycast")
              )

              assert node_cls is LegacyNode
              assert backend == "agentanycast"
          '''.replace("\n          ", "\n").lstrip("\n")
          marker = "def test_transport_defaults_to_keryx_when_setting_is_absent"
          if marker not in test_text:
              test_file.write_text(test_text.rstrip() + "\n\n" + addition, encoding="utf-8")

          makefile = Path("Makefile")
          make_text = makefile.read_text(encoding="utf-8")
          expected = "hermes-agency/tests/test_extended_status_discord.py hermes-agency/tests/test_keryx_transport.py"
          if expected not in make_text:
              raise SystemExit("Makefile Agency test list changed unexpectedly")

          audit = Path("docs/audits/2026-07-10-p0-product-truth-keryx-alignment.md")
          audit_text = audit.read_text(encoding="utf-8")
          audit_text = audit_text.replace("- [ ] Change the config default to `keryx`", "- [x] Change the config default to `keryx`")
          audit_text = audit_text.replace("- [ ] Change tools, node manager, pool, and roster fallbacks to `keryx`", "- [x] Change tools, node manager, pool, and roster fallbacks to `keryx`")
          audit_text = audit_text.replace("- [ ] Restore a genuine explicit AgentAnycast node-class path or remove the runtime fallback claim", "- [x] Restore a genuine explicit AgentAnycast node-class path or remove the runtime fallback claim")
          audit_text = audit_text.replace("- [ ] Ensure configured and effective backend reporting is truthful", "- [x] Ensure configured and effective backend reporting is truthful")
          audit_text = audit_text.replace("- [ ] Add transport-default and resolver regression tests", "- [x] Add transport-default and resolver regression tests")
          audit.write_text(audit_text, encoding="utf-8")
          PY

      - name: Verify Python syntax and patch hygiene
        run: |
          python -m compileall -q hermes-agency
          git diff --check

      - name: Commit runtime alignment
        run: |
          if git diff --quiet; then
            echo "No runtime alignment changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes-agency docs/audits
          git commit -m "fix(agency): make Keryx the truthful runtime default"
          git push origin HEAD:fix/p0-product-truth-keryx-alignment
