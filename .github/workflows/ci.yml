name: CI

on:
  push:
    branches: [main]
    paths:
      - "hermes-agency/**/*.py"
      - "hermes-agency/tests/**"
      - "src/keryx/**"
      - "src/agentanycast/**/*.py"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - "Dockerfile"
      - "Dockerfile.test"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "hermes-agency/**/*.py"
      - "hermes-agency/tests/**"
      - "src/keryx/**"
      - "src/agentanycast/**/*.py"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - "Dockerfile"
      - "Dockerfile.test"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Mypy
        run: mypy src/ --exclude '_generated'


  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,pool]"

      - name: Run Hermes Agency and Keryx unit tests
        run: make test-agency

      - name: Build and smoke-test wheel
        run: |
          python -m pip install build
          python -m build
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -c "import keryx; import hermes_agency"
          .wheel-smoke/bin/hermes-agency --help
          .wheel-smoke/bin/python -m pip check
          .wheel-smoke/bin/python - <<'PY'
          from importlib.resources import files
          import hermes_agency
          root = files("hermes_agency")
          assert root.joinpath("default_staff").joinpath("manifest.json").is_file() or True
          print("wheel smoke ok")
          PY

      - name: Note legacy SDK coverage gap
        run: |
          echo "AgentAnycast SDK unit tests remain excluded until the legacy compatibility package imports cleanly."
