name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  proto-freshness:
    name: Proto Stubs Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout proto repo
        uses: actions/checkout@v4
        with:
          repository: AgentAnycast/agentanycast-proto
          path: agentanycast-proto

      - name: Regenerate Python stubs
        run: |
          cd agentanycast-proto
          printf 'version: v2\nplugins:\n  - remote: buf.build/protocolbuffers/python\n    out: gen/python\n  - remote: buf.build/protocolbuffers/python\n    out: gen/python\n' > /dev/null
          printf 'version: v2\nplugins:\n  - remote: buf.build/protocolbuffers/python\n    out: gen/python\n  - remote: buf.build/grpc/python\n    out: gen/python\n' > buf.gen.python.yaml
          buf generate --template buf.gen.python.yaml

      - name: Check generated stubs match committed files
        run: |
          DIFF=$(diff -r \
            <(find agentanycast-proto/gen/python/agentanycast/ -name '*.py' ! -name '__init__.py' -exec sed 's/# Protobuf Python Version: [0-9.]*/# Protobuf Python Version: X/' {} + | sort) \
            <(find src/agentanycast/_generated/agentanycast/ -name '*.py' ! -name '__init__.py' -exec sed 's/# Protobuf Python Version: [0-9.]*/# Protobuf Python Version: X/' {} + | sort))
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            exit 1
          fi

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/golden-path-proof
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply Ruff fix
        run: |
          ruff check hermes-agency/orchestrator_state.py --fix
          ruff format hermes-agency/orchestrator_state.py

      - name: Commit Ruff fix
        run: |
          if git diff --quiet; then
            echo "Ruff fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes-agency/orchestrator_state.py
          git commit -m "style(agency): apply Ruff import ordering"
          git push origin HEAD:test/golden-path-proof

  type-check:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy src/ --exclude '_generated'

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --strict . --ignore-vuln GHSA-537c-gmf6-5ccf

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Hermes Agency and Keryx unit tests
        run: make test-agency
