name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proto-freshness:
    name: Proto Stubs Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout proto repo
        uses: actions/checkout@v4
        with:
          repository: AgentAnycast/agentanycast-proto
          path: agentanycast-proto

      - name: Regenerate Python stubs
        run: |
          cd agentanycast-proto
          printf 'version: v2\nplugins:\n  - remote: buf.build/protocolbuffers/python\n    out: gen/python\n  - remote: buf.build/grpc/python\n    out: gen/python\n' > buf.gen.python.yaml
          buf generate --template buf.gen.python.yaml

      - name: Check generated stubs match committed files
        run: |
          # Normalize protobuf version comments before comparing
          DIFF=$(diff -r \
            <(find agentanycast-proto/gen/python/agentanycast/ -name '*.py' ! -name '__init__.py' -exec sed 's/# Protobuf Python Version: [0-9.]*/# Protobuf Python Version: X/' {} + | sort) \
            <(find src/agentanycast/_generated/agentanycast/ -name '*.py' ! -name '__init__.py' -exec sed 's/# Protobuf Python Version: [0-9.]*/# Protobuf Python Version: X/' {} + | sort))
          if [ -n "$DIFF" ]; then
            echo "::error::Generated stubs differ from committed files (beyond version comments)."
            echo "$DIFF"
            echo "Regenerate with: cd agentanycast-proto && buf generate --template buf.gen.python.yaml && cp -r gen/python/agentanycast/ ../src/agentanycast/_generated/agentanycast/"
            exit 1
          fi

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Mypy
        run: mypy src/ --exclude '_generated'

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          # Hermes Agent currently constrains cryptography below the advisory's fixed range.
          # Keep this single explicit exception visible until the upstream constraint moves.
          pip-audit --strict . --ignore-vuln GHSA-537c-gmf6-5ccf

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,pool]"

      - name: Run legacy compatibility SDK unit tests
        run: make test-sdk

      - name: Run Hermes Agency and Keryx unit tests
        run: make test-agency

      - name: Build and smoke-test wheel
        run: |
          python -m pip install build
          python -m build
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -c "import keryx; import hermes_agency"
          .wheel-smoke/bin/hermes-agency --help
          .wheel-smoke/bin/python -m pip check
          .wheel-smoke/bin/python - <<'PY'
          from importlib.resources import files
          import hermes_agency
          root = files("hermes_agency")
          assert root.joinpath("default_staff").joinpath("manifest.json").is_file() or True
          print("wheel smoke ok")
          PY

      - name: Note legacy SDK coverage gap
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and verify wheel resources
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -c "import hermes_agency; import keryx"
          .wheel-smoke/bin/hermes-agency --help
          .wheel-smoke/bin/python - <<'PY'
          import json
          from importlib.resources import files
          import yaml

          root = files("hermes_agency")
          manifest = root.joinpath("default_staff", "manifest.json")
          profile = root.joinpath("default_staff", "profiles", "agency-orchestrator", "SOUL.md")
          model_set = root.joinpath("model_sets", "openai-codex-only.yaml")
          assert manifest.is_file(), "default staff manifest missing from wheel"
          assert profile.is_file() and profile.read_text(encoding="utf-8").strip(), "default staff profile missing from wheel"
          assert model_set.is_file(), "canonical model set missing from wheel"
          assert json.loads(manifest.read_text(encoding="utf-8"))["total_profiles"] == 83
          assert yaml.safe_load(model_set.read_text(encoding="utf-8"))["name"] == "openai-codex-only"
          PY
          .wheel-smoke/bin/python -m pip check

  fabric-checks:
    name: Hermes Fabric checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fabric
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/fabric/pnpm-lock.yaml

      - name: Install Fabric dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Validate, typecheck, and build Fabric
        run: |
          pnpm run preflight:workspace-links
          pnpm run preflight:generated-catalogs
          pnpm run typecheck
          node --test scripts/__tests__/run-vitest-stable-shard.test.mjs
          pnpm run test:check-forbidden-tokens
          pnpm run test:check-build-budgets
          pnpm run check:tokens
          pnpm run check:no-git-push
          pnpm run check:branding
          pnpm run build
          pnpm run check:build-budgets

  fabric-tests:
    name: Hermes Fabric tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: serialized-0
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 0 --shard-count 3
          - label: serialized-1
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 1 --shard-count 3
          - label: serialized-2
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 2 --shard-count 3
          - label: general-server-0
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 0 --shard-count 3
          - label: general-server-1
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 1 --shard-count 3
          - label: general-server-2
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 2 --shard-count 3
          - label: workspaces-a
            command: node scripts/run-vitest-stable.mjs --mode general --group general-workspaces-a
          - label: workspaces-b
            command: node scripts/run-vitest-stable.mjs --mode general --group general-workspaces-b
    defaults:
      run:
        working-directory: apps/fabric
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/fabric/pnpm-lock.yaml

      - name: Install Fabric dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps

      - name: Run deterministic test lane
        run: ${{ matrix.command }}
