name: Hermes Fabric Upstream Sync

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: "Optional source repository override in owner/name form"
        required: false
        type: string
      upstream_ref:
        description: "Optional source branch, tag, or commit override"
        required: false
        type: string
      baseline_sha:
        description: "Optional baseline commit override for the first import"
        required: false
        type: string
      bootstrap:
        description: "Record the current source head as the future baseline without importing code"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fabric-upstream-sync
  cancel-in-progress: false

jobs:
  prepare-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve source configuration
        id: config
        shell: bash
        env:
          INPUT_REPOSITORY: ${{ inputs.upstream_repository }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          INPUT_BASELINE: ${{ inputs.baseline_sha }}
          CONFIG_REPOSITORY: ${{ vars.FABRIC_UPSTREAM_REPOSITORY }}
          CONFIG_REF: ${{ vars.FABRIC_UPSTREAM_REF }}
          CONFIG_BASELINE: ${{ vars.FABRIC_UPSTREAM_BASE_SHA }}
          LEGACY_ALIASES: ${{ vars.FABRIC_UPSTREAM_LEGACY_ALIASES }}
          LEGACY_SCOPES: ${{ vars.FABRIC_UPSTREAM_LEGACY_SCOPES }}
        run: |
          repository="${INPUT_REPOSITORY:-$CONFIG_REPOSITORY}"
          ref="${INPUT_REF:-${CONFIG_REF:-master}}"
          baseline="${INPUT_BASELINE:-$CONFIG_BASELINE}"
          if [[ -z "$repository" ]]; then
            echo "Set FABRIC_UPSTREAM_REPOSITORY or provide upstream_repository." >&2
            exit 1
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Source repository must use owner/name form." >&2
            exit 1
          fi
          {
            echo "repository=$repository"
            echo "ref=$ref"
            echo "baseline=$baseline"
            echo "legacy_aliases=$LEGACY_ALIASES"
            echo "legacy_scopes=$LEGACY_SCOPES"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch source history
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.config.outputs.repository }}
          SOURCE_REF: ${{ steps.config.outputs.ref }}
        run: |
          source_dir="$RUNNER_TEMP/fabric-source"
          git clone --filter=blob:none --no-checkout "https://github.com/${SOURCE_REPOSITORY}.git" "$source_dir"
          git -C "$source_dir" fetch --no-tags origin "$SOURCE_REF"
          target_sha="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
          echo "source_dir=$source_dir" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve baseline
        id: baseline
        shell: bash
        env:
          CONFIG_BASELINE: ${{ steps.config.outputs.baseline }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          state_file="apps/fabric/.upstream/state.json"
          tracked=""
          if [[ -f "$state_file" ]]; then
            tracked="$(python -c 'import json; print(json.load(open("apps/fabric/.upstream/state.json")).get("lastImportedCommit", ""))')"
          fi
          baseline="${CONFIG_BASELINE:-$tracked}"
          bootstrap="${BOOTSTRAP:-false}"
          if [[ -z "$baseline" && "$bootstrap" != "true" ]]; then
            echo "No upstream baseline is recorded. Run this workflow manually with bootstrap=true, or set FABRIC_UPSTREAM_BASE_SHA." >&2
            exit 1
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
          if [[ -n "$baseline" && "$baseline" == "$TARGET_SHA" ]]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when already current
        if: steps.baseline.outputs.up_to_date == 'true'
        run: echo "Hermes Fabric already tracks the selected upstream commit."

      - name: Create update branch
        if: steps.baseline.outputs.up_to_date != 'true'
        id: branch
        shell: bash
        env:
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        run: |
          branch="automation/fabric-upstream-${TARGET_SHA:0:12}"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Bootstrap future update tracking
        if: steps.baseline.outputs.up_to_date != 'true' && steps.baseline.outputs.bootstrap == 'true' && steps.baseline.outputs.sha == ''
        shell: bash
        env:
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          SOURCE_REF: ${{ steps.config.outputs.ref }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("apps/fabric/.upstream/state.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "schemaVersion": 1,
              "lastImportedCommit": os.environ["TARGET_SHA"],
              "upstreamRef": os.environ["SOURCE_REF"],
          }, indent=2) + "\n")
          PY

      - name: Prepare normalized snapshots
        if: steps.baseline.outputs.up_to_date != 'true' && !(steps.baseline.outputs.bootstrap == 'true' && steps.baseline.outputs.sha == '')
        id: snapshots
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.source_dir }}
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          FABRIC_UPSTREAM_LEGACY_ALIASES: ${{ steps.config.outputs.legacy_aliases }}
          FABRIC_UPSTREAM_LEGACY_SCOPES: ${{ steps.config.outputs.legacy_scopes }}
        run: |
          if [[ -z "$FABRIC_UPSTREAM_LEGACY_ALIASES" ]]; then
            echo "Set FABRIC_UPSTREAM_LEGACY_ALIASES before importing updates." >&2
            exit 1
          fi
          git -C "$SOURCE_DIR" fetch --no-tags origin "$BASE_SHA"
          base_dir="$RUNNER_TEMP/fabric-base"
          incoming_dir="$RUNNER_TEMP/fabric-incoming"
          git -C "$SOURCE_DIR" worktree add --detach "$base_dir" "$BASE_SHA"
          git -C "$SOURCE_DIR" worktree add --detach "$incoming_dir" "$TARGET_SHA"
          python apps/fabric/scripts/normalize-upstream-import.py --root "$base_dir"
          python apps/fabric/scripts/normalize-upstream-import.py --root "$incoming_dir"
          echo "base_dir=$base_dir" >> "$GITHUB_OUTPUT"
          echo "incoming_dir=$incoming_dir" >> "$GITHUB_OUTPUT"

      - name: Merge normalized update
        if: steps.snapshots.outcome == 'success'
        id: merge
        shell: bash
        env:
          BASE_DIR: ${{ steps.snapshots.outputs.base_dir }}
          INCOMING_DIR: ${{ steps.snapshots.outputs.incoming_dir }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          SOURCE_REF: ${{ steps.config.outputs.ref }}
          FABRIC_UPSTREAM_LEGACY_ALIASES: ${{ steps.config.outputs.legacy_aliases }}
          FABRIC_UPSTREAM_LEGACY_SCOPES: ${{ steps.config.outputs.legacy_scopes }}
        run: |
          report="$RUNNER_TEMP/fabric-upstream-report.json"
          conflicts="apps/fabric/.upstream/conflicts/${TARGET_SHA:0:12}"
          set +e
          python apps/fabric/scripts/merge-upstream-snapshots.py \
            --base "$BASE_DIR" \
            --incoming "$INCOMING_DIR" \
            --current apps/fabric \
            --report "$report" \
            --conflict-root "$conflicts"
          merge_status=$?
          set -e
          python apps/fabric/scripts/normalize-upstream-import.py --root apps/fabric
          cp "$report" "apps/fabric/.upstream/last-sync-report.json"
          if [[ "$merge_status" -eq 0 ]]; then
            rm -rf "apps/fabric/.upstream/conflicts/${TARGET_SHA:0:12}"
            python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("apps/fabric/.upstream/state.json")
          path.write_text(json.dumps({
              "schemaVersion": 1,
              "lastImportedCommit": os.environ["TARGET_SHA"],
              "upstreamRef": os.environ["SOURCE_REF"],
          }, indent=2) + "\n")
          PY
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          elif [[ "$merge_status" -eq 2 ]]; then
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          else
            exit "$merge_status"
          fi

      - name: Verify normalized tree
        if: steps.baseline.outputs.up_to_date != 'true'
        shell: bash
        env:
          LEGACY_ALIASES: ${{ steps.config.outputs.legacy_aliases }}
          LEGACY_SCOPES: ${{ steps.config.outputs.legacy_scopes }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          needles = [item.strip().lower() for item in (os.environ.get("LEGACY_ALIASES", "") + "," + os.environ.get("LEGACY_SCOPES", "")).split(",") if item.strip()]
          output = subprocess.check_output(["git", "grep", "-Iin", "-e", "Hermes Fabric", "--", "apps/fabric"], text=True)
          if not output.strip():
              raise SystemExit("Canonical Hermes Fabric identity is missing")
          for path in subprocess.check_output(["git", "ls-files", "apps/fabric"], text=True).splitlines():
              lower_path = path.lower()
              if any(needle in lower_path for needle in needles):
                  raise SystemExit(f"Legacy source identity remains in path: {path}")
              try:
                  content = open(path, encoding="utf-8").read().lower()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              if any(needle in content for needle in needles):
                  raise SystemExit(f"Legacy source identity remains in content: {path}")
          PY

      - name: Commit and push draft update
        if: steps.baseline.outputs.up_to_date != 'true'
        id: publish
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No update changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(fabric): import normalized upstream update ${TARGET_SHA:0:12}"
          git push --force-with-lease origin "$BRANCH"
          body="$RUNNER_TEMP/fabric-upstream-pr.md"
          {
            echo "## Normalized upstream update"
            echo
            echo "- Baseline: \`${BASE_SHA:-bootstrap}\`"
            echo "- Target: \`$TARGET_SHA\`"
            echo "- Automated brand normalization: applied"
            echo "- Merge conflicts: \`${CONFLICTS:-false}\`"
            echo
            if [[ "$CONFLICTS" == "true" ]]; then
              echo "This draft contains a conflict report under \`apps/fabric/.upstream/conflicts/\`. The tracked baseline was not advanced. Resolve the listed files, remove the conflict artifacts, update the state file to the target commit, and run the normal Fabric checks."
            else
              echo "The source was normalized before the three-way merge. No source package scripts were executed by this write-capable workflow. Standard pull-request CI must verify typecheck, tests, and build before merge."
            fi
          } > "$body"
          title="chore(fabric): import normalized upstream update ${TARGET_SHA:0:12}"
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "$body"
          else
            gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file "$body"
          fi
