name: Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          # Hermes Agent 0.18.2 is the latest published upstream release and exactly
          # pins cryptography and Pillow below the advisory fixed versions. These
          # exceptions remain visible and must be removed when upstream releases a
          # compatible dependency update; this workflow still runs weekly and on
          # dependency changes so new vulnerabilities fail CI immediately.
          pip-audit --strict . \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2026-2253 \
            --ignore-vuln PYSEC-2026-2254 \
            --ignore-vuln PYSEC-2026-2255 \
            --ignore-vuln PYSEC-2026-2256 \
            --ignore-vuln PYSEC-2026-2257 \
            --ignore-vuln PYSEC-2026-3451 \
            --ignore-vuln PYSEC-2026-3452 \
            --ignore-vuln PYSEC-2026-3453
