version: 1
name: local-only-example
description: "Example shape for a real local-only preset. Replace provider/model with values supported by your Hermes runtime."

defaults:
  family: general_worker

families:
  general_worker:
    provider: local
    model: your-local-model
    reason: "Example only."
  coding_worker:
    provider: local
    model: your-local-coding-model
    reason: "Example only."
  creative_worker:
    provider: local
    model: your-local-creative-model
    reason: "Example only."
  analysis_worker:
    provider: local
    model: your-local-model
    reason: "Example only."
  review_worker:
    provider: local
    model: your-local-model
    reason: "Example only."
  orchestration:
    provider: local
    model: your-local-model
    reason: "Example only."
  senior_review:
    provider: local
    model: your-local-model
    reason: "Example only."

profiles: {}

escalation:
  default_family: senior_review
  triggers: [security, release, architecture]

budget:
  max_input_cost_per_1m: 0
  max_output_cost_per_1m: 0
  warn_if_unknown_pricing: false

metadata:
  source: example
  last_reviewed: "2026-06-26"
