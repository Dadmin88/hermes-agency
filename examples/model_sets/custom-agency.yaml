version: 1
name: custom-agency
description: "Example personal preset: economical workers, strong orchestrator, senior escalation."

defaults:
  family: general_worker

families:
  general_worker:
    provider: opencode-go
    model: deepseek-v4-flash
    reason: "Cheap routine work."
  coding_worker:
    provider: opencode-go
    model: qwen3-coder-plus
    reason: "Coding-heavy agency roles."
  creative_worker:
    provider: xai
    model: grok-4.3
    reason: "Creative, worldbuilding, copy, and visual reasoning."
  analysis_worker:
    provider: opencode-go
    model: deepseek-v4-pro
    reason: "Planning and analysis."
  review_worker:
    provider: opencode-go
    model: deepseek-v4-pro
    reason: "Review without defaulting to premium spend."
  orchestration:
    provider: openai-codex
    model: gpt-5.5
    reason: "Senior routing, synthesis, and recovery."
  senior_review:
    provider: openai-codex
    model: gpt-5.5
    reason: "Escalation for risky or high-leverage work."

profiles:
  agency-orchestrator: orchestration
  agency-security-reviewer: senior_review
  agency-systems-architect: senior_review
  agency-software-architect: senior_review
  agency-worldbuilder: creative_worker
  agency-copywriter: creative_worker

escalation:
  default_family: senior_review
  triggers: [security, release, architecture]

budget:
  warn_if_unknown_pricing: true

metadata:
  source: example
  last_reviewed: "2026-06-26"
