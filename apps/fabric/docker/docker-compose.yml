services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: fabric
      POSTGRES_DB: fabric
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric -d fabric"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://fabric:fabric@db:5432/fabric
      PORT: "3100"
      SERVE_UI: "true"
      HERMES_FABRIC_DEPLOYMENT_MODE: "authenticated"
      HERMES_FABRIC_DEPLOYMENT_EXPOSURE: "private"
      HERMES_FABRIC_PUBLIC_URL: "${HERMES_FABRIC_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - fabric-data:/fabric
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  fabric-data:
