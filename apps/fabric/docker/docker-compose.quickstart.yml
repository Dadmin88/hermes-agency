services:
  fabric:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${HERMES_FABRIC_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      HERMES_FABRIC_HOME: "/fabric"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      HERMES_FABRIC_DEPLOYMENT_MODE: "authenticated"
      HERMES_FABRIC_DEPLOYMENT_EXPOSURE: "private"
      HERMES_FABRIC_PUBLIC_URL: "${HERMES_FABRIC_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - "${HERMES_FABRIC_DATA_DIR:-../data/docker-fabric}:/fabric"
