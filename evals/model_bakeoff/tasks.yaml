tasks:
  - id: backend_bugfix_001
    profile: agency-backend-engineer
    category: backend
    prompt: "Given a small failing Python function and test output, identify the bug, patch it, and add one regression test."
  - id: godot_gdscript_001
    profile: agency-godot-engineer
    category: godot
    prompt: "Implement a Godot/GDScript interaction handler that toggles a device and emits a signal without breaking existing scene wiring."
  - id: security_review_001
    profile: agency-security-reviewer
    category: security
    prompt: "Review a config-writing change for secret leakage, unsafe file writes, and privilege boundary mistakes."
  - id: release_checklist_001
    profile: agency-release-manager
    category: release
    prompt: "Build a release readiness checklist from a mixed changelog, test log, and known-risk note."
  - id: docs_rewrite_001
    profile: agency-docs-writer
    category: docs
    prompt: "Rewrite a rough implementation note into concise user-facing docs with commands and warnings."
  - id: worldbuilding_001
    profile: agency-worldbuilder
    category: creative
    prompt: "Create a coherent Hermesverse district concept that connects gameplay, visual style, and technical constraints."
  - id: product_plan_001
    profile: agency-product-manager
    category: product
    prompt: "Turn an ambiguous feature request into scoped MVP, non-goals, acceptance criteria, and follow-up risks."
  - id: qa_plan_001
    profile: agency-qa-lead
    category: qa
    prompt: "Create a layered test plan for a CLI feature that mutates config files and supports dry-run/restore."
  - id: refactor_001
    profile: agency-software-architect
    category: architecture
    prompt: "Propose a low-risk refactor plan for a module that mixes parsing, validation, rendering, and file I/O."
  - id: routing_ambiguity_001
    profile: agency-orchestrator
    category: orchestration
    prompt: "Given an ambiguous user request, choose the best agency profile, explain routing, and identify escalation triggers."
