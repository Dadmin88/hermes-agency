x-agency-env: &agency-env
  HERMES_HOME: /data/hermes
  HERMES_AGENCY_MODEL_SET: ${HERMES_AGENCY_MODEL_SET:-openai-codex-only}
  HERMES_AGENCY_INSTALL_STAFF: ${HERMES_AGENCY_INSTALL_STAFF:-1}
  HERMES_AGENCY_FORCE_STAFF: ${HERMES_AGENCY_FORCE_STAFF:-0}
  HERMES_AGENCY_START_NODE: ${HERMES_AGENCY_START_NODE:-1}
  HERMES_AGENCY_ALLOW_REMOTE_TASKS: ${HERMES_AGENCY_ALLOW_REMOTE_TASKS:-0}
  HERMES_AGENCY_INCOMING_MODE: ${HERMES_AGENCY_INCOMING_MODE:-delegation}
  HERMES_AGENCY_TOOL_ACCESS: ${HERMES_AGENCY_TOOL_ACCESS:-safe}
  HERMES_AGENCY_ORCHESTRATOR: ${HERMES_AGENCY_ORCHESTRATOR:-agency-orchestrator}
  HERMES_AGENCY_ORCHESTRATOR_ENABLED: ${HERMES_AGENCY_ORCHESTRATOR_ENABLED:-1}
  HERMES_AGENCY_TENANT: ${HERMES_AGENCY_TENANT:-default}
  AGENTANYCAST_RELAY: ${AGENTANYCAST_RELAY:-}
  AGENTANYCAST_REGISTRY_ADDRS: ${AGENTANYCAST_REGISTRY_ADDRS:-}

services:
  agency:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agency:local
    command: ["all"]
    environment:
      <<: *agency-env
    volumes:
      - hermes-agency-data:/data/hermes
    restart: unless-stopped

  setup:
    image: hermes-agency:local
    profiles: ["tools"]
    command: ["setup"]
    environment:
      <<: *agency-env
    volumes:
      - hermes-agency-data:/data/hermes

  node:
    image: hermes-agency:local
    profiles: ["split"]
    command: ["node"]
    environment:
      <<: *agency-env
    volumes:
      - hermes-agency-data:/data/hermes
    restart: unless-stopped

volumes:
  hermes-agency-data:
